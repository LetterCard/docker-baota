# ==============================================================================
#  📋 线声明表 —— 各条线**唯一**的差异都写在下面这几行里
#
#  构建、发布、每日巡检、漂移检测都从这张表取值：新增一条线 = 加一行；
#  上游换线 = 改这一行。请不要把线的差异写进 workflow 或 Dockerfile 的逻辑里
#  （唯一允许的分支见 build.yml 的「探测方式」，那也是读表里的字段）。
#
#  字段（顺序固定，空格分隔）：
#    line       线标识 —— **所有内部键**都用它（流水线矩阵、产物名、缓存 scope）。
#               按面板主线命名，一旦定下就再也不用改：14/15 出来时是
#               「加一行 14_version」，而不是给旧行改名
#    display    显示名，只给人看（镜像标签始终是「版本号」，不是这两个名字）
#    version    该线当前已发布版本的文件（发布流水线推送成功后回写，勿手改）
#    install    官方安装脚本地址（上游换线时只改这里）
#    probe      版本探测方式：banner=抓安装脚本横幅、api=官方 get_version 接口
#    tag        标签策略：exact=只发 <版本>，latest=<版本> + latest
#               某条线成为「最新正式线」时，把 latest 挪到那一行、旧行改回 exact
#    base       基础镜像（要与该线的上游目标发行版一致）
#
#  ★ 术语：中文一律叫「线」（line）。英文 release channel 不另起中文译名，
#    全仓统一用「线」—— 见 docs/conventions.md §7
#
#  ⚠️ 各线的地址请保持相邻、成对出现，方便对照与修改
#  ------------------------------------------------------------------------------
#  line       display version                   install                                            probe  tag    base
  12_version 12.x    image/versions/12/VERSION https://download.bt.cn/install/installStable_12.sh banner exact  debian:12
  13_version 13.x    image/versions/13/VERSION https://download.bt.cn/install/install_panel.sh    api    latest debian:12
