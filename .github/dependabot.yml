version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 同一周的所有 Actions 更新合并为一个 PR，减少打扰
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
 
  # 基础镜像依赖：跟踪 release/stable 两个 Dockerfile 的 FROM debian:12（apt 安全补丁
  # 由定时强制重建拾取；此处覆盖基础镜像本身的 patch 升级建议）。
  # 注意：Dockerfile 内的 ARG DOCKER_CLI_VERSION 静态 docker CLI 版本 Dependabot 无法覆盖，
  #       由 scripts/check_docker_cli.sh 在 CI 中自动检查并幂等开 issue（见 README「自动化能力」）。
  - package-ecosystem: "docker"
    directory: "/release"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "debian"
    commit-message:
      prefix: "docker"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/stable"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "debian"
    commit-message:
      prefix: "docker"
      include: "scope"
