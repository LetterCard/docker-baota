# ============================================================
# 自动构建宝塔正式版（Latest release）镜像并推送到 DockerHub
#
# 自动维护流程：
#   取版本：scripts/detect_version.sh --mode release（主源 updateLinux + 兜底源 get_version，
#           全源失效时 fail-closed 报错；可经手动 inputs.version 覆盖）
#   已构建判断：检查 DockerHub 镜像标签 bugseeker/baota:<版本> 是否已存在（唯一真源）
#   触发方式（长期免维护）：
#     - 每周一（UTC 03:17）【强制重建】：即使版本未变也重建并重推 <版本> + latest，
#       拾取 debian 基础镜像/apt 安全补丁更新（build-push-action 已开 pull:true 强制拉最新 base）
#     - 每周四（UTC 03:17）【版本检测】：仅当官方出新版本时才构建（较原每月 1 号更灵敏；
#       bt.cn 无公开发版订阅/webhook，故以缩短检测间隔为取舍；保持每周 1-2 次不浪费 runner 额度）
#     - push main/master（release/** 变更）
#     - 手动触发（Actions 页面 Run workflow，可传 inputs.version 强制指定版本）
#
# 可观测与自愈：
#   - 每次构建在 Step Summary 输出：版本 / 架构 / 标签 / 是否强制刷新 / Trivy 摘要
#   - 构建/冒烟失败：on-failure job 自动开 issue 并 @维护者（连续 3 次降级为仅告警）
#   - Trivy 可修复 HIGH/CRITICAL：推送不阻断，但自动开 issue 跟踪
#
# 配置要求（GitHub 仓库 Settings -> Secrets and variables -> Actions）：
#   DOCKER_USERNAME : 你的 DockerHub 用户名
#   DOCKER_TOKEN    : DockerHub Access Token（不是登录密码，scoped access token）
#
# 推送到：DOCKER_USERNAME/baota:<动态版本> 与 :latest
#         （latest 由正式版持有；稳定版不带 latest）
#
# 安全机制：先以单架构(amd64)构建并启动容器做冒烟测试（面板存活 / 端口响应 / bt 命令可用 / SSH），
#          验证通过后才推送多架构镜像。验证失败则 push job 不执行，避免坏镜像进入生产仓库。
# ============================================================
name: Build Baota Release

on:
  # 每周一 UTC 03:17 强制重建（安全补丁刷新）；每周四 UTC 03:17 版本检测（官方发版后最多 4 天内感知，
  # 较原每月 1 号更灵敏；bt.cn 无公开发版订阅，以缩短检测间隔为取舍，且仅 release 提高频率、stable 保持每月一次）
  # 两者错峰执行，非整点(17分)避开 GitHub runner 整点拥堵
  schedule:
    - cron: "17 3 * * 1"
    - cron: "17 3 * * 4"
  push:
    branches: [main, master]
    paths:
      - 'release/**'
      - 'scripts/smoke.sh'
      - 'scripts/detect_version.sh'
      - '.github/workflows/docker-build-release.yml'
  # 手动触发：可传 inputs.version 强制指定版本（版本源失效时的手动覆盖方式，见 README）
  workflow_dispatch:
    inputs:
      version:
        description: '强制指定构建版本（如 13.0.0）；留空则自动检测官方最新版'
        required: false
        default: ''

env:
  # DockerHub 镜像仓库名（不含用户名，仓库自动创建为公开库）
  REPO_NAME: baota
  # 冒烟测试用的面板端口（与环境变量默认值一致）
  SMOKE_PORT: "8888"
  # 构建上下文目录（本套独立维护）
  BUILD_DIR: release

# 避免定时 / push / 手动触发重叠（与各版本独立分组）
concurrency:
  group: build-baota-release
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 0) 动态获取官方最新正式版版本号，并判断是否需要构建
  # ==========================================================
  check-version:
    name: Check Latest Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
      force_refresh: ${{ steps.check.outputs.force_refresh }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve latest version (detect_version.sh)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/detect_version.sh
          FORCE_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            FORCE_ARG="--force-tag ${{ github.event.inputs.version }}"
          fi
          # shellcheck disable=SC2086
          bash scripts/detect_version.sh --mode release $FORCE_ARG --out "$GITHUB_OUTPUT" --verbose
          echo "检测到官方最新正式版：${{ steps.version.outputs.version }}"

      - name: Check docker CLI version (auto-maintain ARG, Dependabot can't cover)
        shell: bash
        run: |
          chmod +x scripts/check_docker_cli.sh
          bash scripts/check_docker_cli.sh --dockerfile release/Dockerfile --flavor release || true

      - name: Check if DockerHub image tag already exists
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # DockerHub v2 API：标签不存在返回 404 -> 需要构建；200 -> 已存在，跳过
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}/tags/$VERSION")

          # 强制重建场景：手动触发 或 每周一安全补丁刷新调度（cron "17 3 * * 1"）。
          # 此时即使镜像标签已存在也重建重推，拾取 debian/apt 安全补丁；其余调度按标签存在性跳过。
          FORCE_REFRESH=false
          case "${{ github.event.schedule }}" in
            "17 3 * * 1") FORCE_REFRESH=true ;;
          esac
          echo "force_refresh=${FORCE_REFRESH}" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" = "200" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$FORCE_REFRESH" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "镜像标签 $VERSION 已存在于 DockerHub，且非手动/每周刷新触发，跳过构建。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "$HTTP_CODE" = "200" ]; then
              if [ "$FORCE_REFRESH" = "true" ]; then
                echo "每周安全补丁刷新：镜像标签 $VERSION 已存在，强制重建并重推（拾取 debian/apt 补丁）。"
              else
                echo "镜像标签 $VERSION 已存在，但本次为手动触发，强制重新构建并验证。"
              fi
            else
              echo "镜像标签 $VERSION 不存在，将构建并推送。"
            fi
          fi

  # ==========================================================
  # 1) 单架构构建 + 冒烟测试（仅当需要构建时执行）
  # ==========================================================
  build-smoke:
    name: Build (amd64) & Smoke Test
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pre-install sshpass (for SSH smoke test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_DIR }}
          file: ${{ env.BUILD_DIR }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: baota-smoke:latest
          # pull:true 强制从 registry 拉取最新基础镜像，避免 gha cache 命中旧 base 层，
          # 确保每周强制重建确实拾取 debian/apt 安全补丁（B1 长期自维护）
          pull: true
          build-args: |
            BT_VERSION=${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test (B-first with A fallback + SSH)
        shell: bash
        env:
          SMOKE_PORT: ${{ env.SMOKE_PORT }}
          EXPECT_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh baota-smoke:latest

  # ==========================================================
  # 2) 多架构构建并推送（冒烟测试通过后才执行）
  # ==========================================================
  push:
    name: Build & Push to DockerHub (multi-arch)
    needs: [check-version, build-smoke]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      issues: write   # Trivy 可修复高危漏洞自动开 issue（B3）

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          IMG="${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}"
          VER="${{ needs.check-version.outputs.version }}"
          # 正式版：打动态版本标签 + latest（latest 由本版本持有）
          TAGS="$IMG:$VER,$IMG:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_DIR }}
          file: ${{ env.BUILD_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # pull:true：强制拉取最新基础镜像，保证强制重建拾取安全补丁（B1）
          pull: true
          build-args: |
            BT_VERSION=${{ needs.check-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy vulnerability scan (JSON for issue tracking)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:${{ needs.check-version.outputs.version }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Print Trivy table summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:${{ needs.check-version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Open issue for fixable HIGH/CRITICAL (B3, idempotent)
        shell: bash
        run: |
          chmod +x scripts/open_trivy_issue.sh
          bash scripts/open_trivy_issue.sh \
            --trivy-json trivy-results.json \
            --version "${{ needs.check-version.outputs.version }}" \
            --flavor release \
            --out /tmp/trivy.out || true
          cat /tmp/trivy.out 2>/dev/null || true

      - name: Write build summary
        shell: bash
        run: |
          VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | select(.FixedVersion != null and .FixedVersion != "")] | length' trivy-results.json 2>/dev/null || echo 0)
          FORCE="${{ needs.check-version.outputs.force_refresh }}"
          FORCE_TXT="否"
          [ "$FORCE" = "true" ] && FORCE_TXT="是（安全补丁强制重建）"
          {
            echo "## 🏗️ 宝塔正式版构建完成（自动维护）"
            echo ""
            echo "- **版本**：\`${{ needs.check-version.outputs.version }}\`（官方最新正式版，持有 latest 标签）"
            echo "- **架构**：linux/amd64 + linux/arm64"
            echo "- **推送**：\`${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}\`"
            echo "- **标签**：\`${{ needs.check-version.outputs.version }}\`、\`latest\`"
            echo "- **强制刷新**：${FORCE_TXT}"
            echo "- **可修复 HIGH/CRITICAL**：${VULN_COUNT} 个（>0 时已自动开 issue 跟踪）"
            echo "- **提交**：\`${{ github.sha }}\`"
            echo ""
            echo "> 版本号由 scripts/detect_version.sh 动态获取（fail-closed）；冒烟测试（面板存活 + 端口响应 + bt 命令 + SSH，含版本一致性校验）通过后才推送；漏洞扫描见上方 Trivy 步骤日志。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # 3) 失败自愈：构建/冒烟/推送失败时自动开 issue（连续 3 次降级为仅告警，见 D2）
  # ==========================================================
  on-failure:
    name: Notify Failure (auto issue)
    if: failure()
    needs: [check-version, build-smoke, push]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Open failure issue (idempotent + downgrade)
        shell: bash
        env:
          MAINTAINER_HANDLE: ${{ vars.MAINTAINER_HANDLE }}
        run: |
          chmod +x scripts/open_failure_issue.sh
          VERSION="${{ needs.check-version.outputs.version }}"
          [ -n "$VERSION" ] || VERSION="unknown"
          FAILED_JOB=""
          [ "${{ needs.check-version.result }}" = "failure" ] && FAILED_JOB="check-version"
          [ "${{ needs.build-smoke.result }}" = "failure" ] && FAILED_JOB="build-smoke"
          [ "${{ needs.push.result }}" = "failure" ] && FAILED_JOB="push"
          bash scripts/open_failure_issue.sh \
            --workflow docker-build-release \
            --version "$VERSION" \
            --flavor release \
            --failed-job "$FAILED_JOB" \
            --out /tmp/fail.out || true
          cat /tmp/fail.out 2>/dev/null || true
