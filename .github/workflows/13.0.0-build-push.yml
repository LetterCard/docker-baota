name: 📦 13.0.0：构建并发布镜像

# ==============================================================================
#  📦 13.0.0 通道：每日自动跟进宝塔「13.0.0」并发布镜像
#
#  与 12.0.0 通道的区别：
#    - 安装脚本用引导式的 install_panel.sh（自身不含版本号，装出的版本由
#      官方服务端决定），而 12.0.0 用带版本横幅的 installStable_12.sh
#    - 版本号只取自官方 get_version API，与 dockerfile/13.0.0/VERSION 比对决定是否发布，
#      不再实装 install_panel.sh 去反查版本
#    - 发布 <版本> 与 latest 两个标签（12.0.0 只发精确版本标签）
#
#  流程（每天自动跑一次，也可手动触发）：
#    🧹 lint        静态检查（shellcheck + 语法 + YAML），无条件运行，
#                   与是否有新版本无关
#    🔍 detect      get_version API 取最新版号，与 dockerfile/13.0.0/VERSION 比对；
#                   一致 → 结束；不一致 → 进入构建
#    🏗️ build       双架构：构建两次 —— 第一次本地构建+三套健康检查
#                   （20 项功能检查 / 挂载与降级场景 / 升级与降级路径），
#                   通过后第二次按 digest 推送（不创建 arch 标签）
#    🚀 publish     合并 digest → 打 repo:<版本> 与 repo:latest
#    ✏️ writeback   把「实际推送的版本号」回写 dockerfile/13.0.0/VERSION，供下次比对
#
#  关键保证：
#    - dockerfile/13.0.0/VERSION 永远对应「已成功推送」的版本（回写在发布之后）
#    - 构建失败时 VERSION 不动，下次运行会自动重试同一版本
#    - 回写推送失败仅告警：下次 detect 仍会发现不一致并自愈
#    - 官方安装脚本若被改坏，构建阶段（安装宝塔 + 20 项健康检查）会失败中断，
#      latest 不会指向坏镜像
#
#  🧩 与通道无关的四步（lint / build / publish / writeback）已抽到
#     .github/workflows/reusable-build-push.yml，由本文件末尾的 release job 调用
#
#  🔑 所需仓库 Secrets：
#    DOCKERHUB_USERNAME  DockerHub 用户名
#    DOCKERHUB_TOKEN     DockerHub Access Token（不要用登录密码）
#  writeback 推送 main 需要 Workflow permissions 勾选 Read and write permissions。
# ==============================================================================

on:
  # 发布已改为手动，不再定时自动发布。
  # 13.0.0 通道会推进 `latest` 标签，每天自动发布意味着上游一旦出问题，
  # 坏镜像会立刻被所有使用 `latest` 的用户拉到 —— 这是本项目最大的风险敞口。
  # 改为手动：先确认 .github/workflows/drift.yml 的报告无关键漂移，
  # 再手动触发本工作流。
  #
  # 唯一的输入项是「强制更新」：它只影响「是否跳过『已一致』判断」，
  # 版本仍来自 get_version API —— 不存在「探测一个版本、构建另一个」的隐患
  workflow_dispatch:
    inputs:
      force_update:
        description: '🔧 强制更新：跳过「已是最新」判断，直接重建发布（探测失败则按 VERSION 当前值）'
        type: boolean
        default: false


# 同一时刻只跑一个：排队期间上游版本若已被上一次运行发布，
# 重新探测会得到「已一致」，后续 job 自动跳过
concurrency:
  group: 13.0.0-build
  cancel-in-progress: false

env:
  VERSION_FILE: dockerfile/13.0.0/VERSION
  # 安装脚本地址不再在这里定义：13.0.0 通道没有 workflow_dispatch 输入可覆盖它，
  # 写死会与 dockerfile/13.0.0/Dockerfile 的 ARG 默认值重复。由 Dockerfile 默认值提供即可。
  VERSION_API: https://www.bt.cn/api/panel/get_version
  IMAGE_NAME: baota

jobs:
  # ---------------------------------------------------------------------------
  # 🔍 版本号比对：get_version API vs dockerfile/13.0.0/VERSION。
  # 一致 → 今天无事可做；不一致 → 输出新版本号，交给 build 构建发布。
  # ---------------------------------------------------------------------------
  detect:
    name: 🔍 探测版本（13.0.0 通道）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      changed: ${{ steps.detect.outputs.changed }}
      probe: ${{ steps.detect.outputs.probe }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔍 探测上游版本并与 VERSION 比对
        id: detect
        run: |
          # 探测 get_version API。失败（无返回 / 格式异常）不再 exit 1，而是记
          # probe=failed 并回退到 dockerfile/13.0.0/VERSION 当前值继续 —— 与 12.0.0
          # 通道一致：探测不到上游状态时，宁可按仓库已知版本继续，也不让整 job 红掉。
          UPSTREAM=""
          TMP=$(mktemp)
          if curl -fsSL --connect-timeout 10 --max-time 30 "$VERSION_API" -o "$TMP" 2>/dev/null; then
            UPSTREAM=$(tr -d '[:space:]' < "$TMP" || true)
            rm -f "$TMP"
          else
            rm -f "$TMP"
          fi

          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE" || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::$VERSION_FILE 为空"
            exit 1
          fi

          # 探测失败（无返回或非 x.y.z）→ 记 probe=failed，回退 VERSION 当前值，不退出
          if [ -z "$UPSTREAM" ] || ! printf '%s' "$UPSTREAM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "probe=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::无法从 get_version API 取得有效版本（${VERSION_API}），按 $VERSION_FILE(${CURRENT}) 继续"
            UPSTREAM="$CURRENT"
          else
            echo "probe=ok" >> "$GITHUB_OUTPUT"
          fi

          if [ "$UPSTREAM" = "$CURRENT" ]; then
            RESULT=up-to-date
          else
            LATEST=$(printf '%s\n%s\n' "$CURRENT" "$UPSTREAM" | sort -V | tail -1)
            if [ "$LATEST" = "$UPSTREAM" ]; then
              RESULT=new-version
            else
              # API 版本低于仓库：官方回滚或 API 异常，绝不自动降级
              RESULT=behind
            fi
          fi

          # 🔧 强制更新：手动勾选后跳过「已是最新」判断，无条件进入构建发布。
          # 版本仍以探测结果为准；探测失败已回退到 VERSION 当前值（见上）——
          # 强制的是「重建发布」这个动作，不是编造版本号
          if [ '${{ inputs.force_update }}' = 'true' ]; then
            echo "🔧 强制更新模式：跳过版本比对，无条件构建发布（版本 ${UPSTREAM}）"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$RESULT" = "new-version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "发现新版本：${CURRENT} → ${UPSTREAM}，进入构建发布"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "仓库版本 ${CURRENT}，API 版本 ${UPSTREAM}（${RESULT}），无需发布"
          fi
          echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"

      - name: 📋 输出摘要
        if: always()
        run: |
          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE" 2>/dev/null || echo 未知)
          FORCE='${{ inputs.force_update }}'
          PROBE='${{ steps.detect.outputs.probe }}'
          if [ "${FORCE}" = 'true' ]; then
            # 强制更新：探测到什么用什么，探测失败已回退 VERSION 当前值
            TEXT="🔧 强制更新：跳过版本比对，按 ${{ steps.detect.outputs.version }} 重建发布"
          elif [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
            TEXT="🎉 发现新版本：${CURRENT} → ${{ steps.detect.outputs.version }}"
          elif [ "${PROBE}" = "failed" ]; then
            TEXT="⚠️ 探测失败，按 ${CURRENT} 继续，本次不构建（可手动重跑）"
          else
            TEXT="✅ 已一致（${CURRENT}），无需发布"
          fi
          {
            echo "### 📦 13.0.0 通道检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| dockerfile/13.0.0/VERSION | \`${CURRENT}\` |"
            echo "| get_version API | \`${{ steps.detect.outputs.version || '获取失败' }}\` |"
            echo "| 强制更新 | ${FORCE} |"
            echo "| 结果 | ${TEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 🧹 静态检查：shellcheck + 语法 + YAML
  #
  # 本地 `make lint` 在没装 shellcheck 时会「跳过」，等于这道检查长期没人真正跑过。
  # 放到 CI 里先装工具再跑，脚本质量才有持续保障。
  #
  # 与版本探测无关，所以**无条件运行**：即使今天没有新版本、不发布镜像，
  # 代码问题也能当天被发现，而不是拖到下次发布才暴露
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 🏗️ 以下 lint / build / publish / writeback 四个 job 已抽到
  # .github/workflows/reusable-build-push.yml —— 它们与「版本从哪来」无关，
  # 两个通道逐字相同，改构建流程只需改那一处。
  # 本文件只保留真正的通道差异：版本探测（get_version API）+ 参数装配。
  # ---------------------------------------------------------------------------
  release:
    name: 🏗️ 构建并发布（13.0.0 通道）
    needs: detect
    uses: ./.github/workflows/reusable-build-push.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      channel: "13.0.0"
      version: ${{ needs.detect.outputs.version }}
      changed: ${{ needs.detect.outputs.changed }}
      version_file: dockerfile/13.0.0/VERSION
      dockerfile: ./dockerfile/13.0.0/Dockerfile
      cache_scope: "13.0.0"
      publish_latest: true
