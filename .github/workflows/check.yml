name: 🔬 巡检：已发布镜像回归

# ==============================================================================
#  🔬 每天从 DockerHub 拉取「已发布」的镜像跑回归，结果回写
#  .github/reports/report.md（并内嵌进 README）。
#
#  与构建工作流的分工：构建工作流验「本地构建的候选镜像」（拦在推送前）；
#  本工作流验「线上已发布的镜像」，每天确认它仍然健康。
#
#  ★ 多 job 结构（进度一目了然，每线一张独立 job 卡）：
#     prep    读 image/lines.conf 生成「线 × 版本」矩阵（新增一条线不用改本文件）
#     verify  每线一个 job 跑 published.sh（拉取 + 脱敏首启日志 + PHP 扩展真编译
#              + 复用三套发布前门禁）；各自独立进度
#     report  汇总报告并回写 README / .github/reports/report.md
#  验什么由 .github/scripts/check/published.sh 决定。
# ==============================================================================

on:
  schedule:
    - cron: '30 18 * * *'      # 每天 UTC 18:30（北京时间 02:30）
  workflow_dispatch: {}

concurrency:
  group: published
  cancel-in-progress: false

env:
  IMAGE_NAME: baota
  REPORT: .github/reports/report.md
  CHECK_DIR: .github/scripts/check
  LINES: image/lines.conf

jobs:
  # ---------------------------------------------------------------------------
  #  1) 读线声明表，生成逐线矩阵
  # ---------------------------------------------------------------------------
  prep:
    name: 🔍 读线声明表
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔍 生成逐线矩阵
        id: plan
        run: |
          set -euo pipefail
          matrix='[]'
          while read -r line display vfile _url _probe _tag _base; do
            [ -n "${line:-}" ] || continue
            ver=$(tr -d '[:space:]' < "${vfile}")
            [ -n "${ver}" ] || { echo "::error::${vfile} 为空"; exit 1; }
            matrix=$(jq -c --arg line "${line}" --arg display "${display}" --arg ver "${ver}" \
              '. + [{line:$line, display:$display, version:$ver}]' <<< "${matrix}")
          done < <(grep -vE '^[[:space:]]*(#|$)' "${LINES}")
          echo "matrix=$(jq -c . <<< "${matrix}")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  #  2) 每线一个 job 跑回归（独立进度）
  # ---------------------------------------------------------------------------
  verify:
    name: 🔬 验证 ${{ matrix.display }}
    needs: [prep]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 不要 fail-fast：让所有线都跑完，一次就能看到各自的问题
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔬 跑回归（拉取 + 脱敏首启日志 + PHP 扩展真编译 + 三套门禁）
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -uo pipefail
          echo "🔬 开始验证 ${{ matrix.display }}（${{ matrix.version }}）…"
          bash "${CHECK_DIR}/published.sh" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${{ matrix.version }}" \
              "${{ matrix.version }}" "/tmp/report-${{ matrix.line }}.md"

      - name: 📦 上传回归报告
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-${{ matrix.line }}
          path: /tmp/report-${{ matrix.line }}.md
          retention-days: 1

  # ---------------------------------------------------------------------------
  #  3) 汇总报告并回写仓库
  # ---------------------------------------------------------------------------
  report:
    name: 📝 汇总并回写
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # rebase 必须在「生成 / 修改任何仓库文件」之前执行：此时 working tree 干净。
      # 否则报告 / README 已处于 modified，git rebase 会因 dirty tree 中止
      - name: 🔄 同步 main（rebase）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: 📥 下载回归报告
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: report-*
          path: /tmp
          merge-multiple: true
          if-no-artifacts-found: ignore

      - name: 🔬 逐线汇总并生成报告
        run: |
          set -uo pipefail
          failed=0
          summary=''
          detail=''

          while read -r line display vfile _url _probe _tag _base; do
            [ -n "${line:-}" ] || continue
            ver=$(tr -d '[:space:]' < "${vfile}")

            # 回归脚本自己会 pull / 起容器 / 跑三套门禁；这里只负责收集结果。
            # 产物在 verify job 各自上传：有报告 = 通过，缺报告 = 该线失败
            if [ -f "/tmp/report-${line}.md" ]; then
              icon='✅'
              echo "✅ ${display}（${ver}）通过"
            else
              icon='❌'
              failed=1
              echo "::error::${display}（${ver}）回归未通过，详见下方报告片段"
            fi

            summary="${summary}| ${display} | \`${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ver}\` | ${icon} |"$'\n'
            detail="${detail}## ${display}（${line}，${ver}）"$'\n\n'
            if [ -f "/tmp/report-${line}.md" ]; then
              detail="${detail}$(cat "/tmp/report-${line}.md")"$'\n'
            else
              detail="${detail}_（该线未产出报告，见构建日志）_"$'\n'
            fi
            detail="${detail}"$'\n---\n\n'
          done < <(grep -vE '^[[:space:]]*(#|$)' "${LINES}")

          {
            echo '# 📊 已发布镜像每日验证报告'
            echo
            echo '> 本文件由 `.github/workflows/check.yml` 自动生成，每次运行整体覆盖（不追加）。'
            echo
            echo "- 生成时间（UTC）：$(date -u '+%F %T')"
            echo "- 触发方式：${{ github.event_name }}"
            echo '- 验证平台：linux/amd64（GitHub-hosted runner；arm64 不在本报告覆盖范围，由构建工作流在原生 ARM runner 上负责）'
            echo "- 验证脚本：\`${CHECK_DIR}/published.sh\`"
            echo
            echo '## 概要'
            echo
            echo '| 线 | 镜像 | 结果 |'
            echo '|---|---|---|'
            printf '%s' "${summary}"
            echo
            echo '---'
            echo
            printf '%s' "${detail}"
          } > "${REPORT}"

          echo '--- 报告已生成（前 30 行）---'
          head -n 30 "${REPORT}"
          [ "${failed}" -eq 0 ] || echo "FAILED=1" >> "$GITHUB_ENV"

      - name: ✏️ 注入 README 并回写仓库
        run: |
          set -euo pipefail
          python3 .github/scripts/report.py "${REPORT}"
          git add "${REPORT}" README.md

          echo '--- 待提交变更 ---'
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo '报告内容无变化，跳过提交'
            exit 0
          fi
          git commit -m "docs: 更新每日镜像验证报告 $(date -u '+%F')"

          # 漂移检测工作流也会改 README，两边同时回写时推送会被拒（非快进）：
          # 重取远端再试，而不是让整轮巡检白跑（报告已经生成好了）；README 两边都
          # 改过时 rebase 会冲突，此时以本地刚生成的报告为准（-X ours）
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::push 失败（第 ${attempt} 次），同步远端后重试"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              git merge -X ours --no-edit origin/main
            fi
            sleep 5
          done
          echo '::error::报告回写失败（连续 3 次 push 被拒）'
          exit 1

      - name: 🚦 判定
        run: |
          if [ "${FAILED:-0}" = '1' ]; then
            echo "::error::有线未通过回归验证，详见 ${REPORT}"
            exit 1
          fi
          echo '✅ 各条线的已发布镜像均通过回归验证'
