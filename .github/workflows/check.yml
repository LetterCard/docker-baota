name: 🔬 日巡检：已发布镜像回归

# ==============================================================================
#  🔬 每天从 DockerHub 拉取「已发布」的镜像跑回归，结果回写
#  .github/reports/report.md（并内嵌进 README）。
#
#  与构建工作流的分工：构建工作流验「本地构建的候选镜像」（拦在推送前）；
#  本工作流验「线上已发布的镜像」，每天确认它仍然健康。
#
#  单 job 顺序跑各条线：线是从 image/channels.conf 读的，新增一条线不用改本文件。
#  顺序而不是矩阵，是为了把「产物上传 → 下载 → 汇总」那套搬运彻底去掉 ——
#  两条线各约 10 分钟，串行也在 60 分钟内跑完，换来的是一份一眼能读完的流水线。
#
#  验什么由 .github/scripts/check/published.sh 决定（拉取 + 脱敏首启日志 +
#  PHP 扩展真编译 + 复用三套发布前门禁）。
# ==============================================================================

on:
  schedule:
    - cron: '30 18 * * *'      # 每天 UTC 18:30（北京时间 02:30）
  workflow_dispatch: {}

concurrency:
  group: published
  cancel-in-progress: false

env:
  IMAGE_NAME: baota
  REPORT: .github/reports/report.md
  HC: .github/scripts/check
  CHANNELS: image/channels.conf

jobs:
  check:
    name: 🔬 验证已发布镜像并回写报告
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # rebase 必须在「生成 / 修改任何仓库文件」之前执行：此时 working tree 干净。
      # 否则报告 / README 已处于 modified，git rebase 会因 dirty tree 中止
      - name: 🔄 同步 main（rebase）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: 🔬 逐线跑回归并生成报告
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -uo pipefail
          failed=0
          summary=''
          detail=''

          while read -r line channel vfile _url _probe _tag _base; do
            [ -n "${line:-}" ] || continue
            ver=$(tr -d '[:space:]' < "${vfile}")
            [ -n "${ver}" ] || { echo "::error::${vfile} 为空"; exit 1; }

            # 回归脚本自己会 pull / 起容器 / 跑三套门禁；这里只负责收集结果
            if bash "${HC}/published.sh" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ver}" \
                    "${ver}" "/tmp/report-${line}.md"; then
              icon='✅'
              echo "✅ ${channel}（${ver}）通过"
            else
              icon='❌'
              failed=1
              echo "::error::${channel}（${ver}）回归未通过，详见下方报告片段"
            fi

            summary="${summary}| ${channel} | \`${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ver}\` | ${icon} |"$'\n'
            detail="${detail}## ${channel}（${line}，${ver}）"$'\n\n'
            if [ -f "/tmp/report-${line}.md" ]; then
              detail="${detail}$(cat "/tmp/report-${line}.md")"$'\n'
            else
              detail="${detail}_（该线未产出报告，见构建日志）_"$'\n'
            fi
            detail="${detail}"$'\n---\n\n'
          done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")

          {
            echo '# 📊 已发布镜像每日验证报告'
            echo
            echo '> 本文件由 `.github/workflows/check.yml` 自动生成，每次运行整体覆盖（不追加）。'
            echo
            echo "- 生成时间（UTC）：$(date -u '+%F %T')"
            echo "- 触发方式：${{ github.event_name }}"
            echo '- 验证平台：linux/amd64（GitHub-hosted runner；arm64 不在本报告覆盖范围，由构建工作流在原生 ARM runner 上负责）'
            echo "- 验证脚本：\`${HC}/published.sh\`"
            echo
            echo '## 概要'
            echo
            echo '| 通道 | 镜像 | 结果 |'
            echo '|---|---|---|'
            printf '%s' "${summary}"
            echo
            echo '---'
            echo
            printf '%s' "${detail}"
          } > "${REPORT}"

          echo '--- 报告已生成（前 30 行）---'
          head -n 30 "${REPORT}"
          [ "${failed}" -eq 0 ] || echo "FAILED=1" >> "$GITHUB_ENV"

      - name: ✏️ 注入 README 并回写仓库
        run: |
          set -euo pipefail
          python3 .github/scripts/report.py "${REPORT}"
          git add "${REPORT}" README.md

          echo '--- 待提交变更 ---'
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo '报告内容无变化，跳过提交'
            exit 0
          fi
          git commit -m "docs: 更新每日镜像验证报告 $(date -u '+%F')"
          git push origin HEAD:main

      - name: 🚦 判定
        run: |
          if [ "${FAILED:-0}" = '1' ]; then
            echo "::error::有通道未通过回归验证，详见 ${REPORT}"
            exit 1
          fi
          echo '✅ 各通道的已发布镜像均通过回归验证'
