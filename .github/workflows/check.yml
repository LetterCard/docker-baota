name: 🔬 已发布镜像回归

# ==============================================================================
#  🔬 每天从 DockerHub 拉取「已发布」的镜像 → 起容器 → 跑回归 → 回写报告
#
#  与构建工作流（.github/workflows/build.yml）的分工：
#    构建工作流 验的是「本地构建出来的候选镜像」，把坏镜像拦在推送之前
#    本工作流   验的是「DockerHub 上已发布的镜像」，每天确认线上镜像仍然健康
#               （上游脚本变更、镜像被重新推送、依赖漂移都能第一时间发现）
#
#  验哪些镜像：通道与版本都从 image/channels.conf 与各通道 VERSION 文件读，
#  不做上游探测 —— 本工作流只回答「当前线上这套东西还好不好用」。
#  新增通道 = 改 channels.conf，这里不用动（矩阵从表里生成）。
#
#  验什么：三件只有线上镜像才需要的事（拉取 / 脱敏首启日志 / PHP 扩展真编译），
#  外加**复用发布前三套门禁**（core / degrade / upgrade）—— 持久化、重建、
#  并发锁、只读降级、备份、版本护栏、守卫等全部由那三套覆盖，
#  同一件事只维护一份断言（见 .github/scripts/check/published.sh 头部注释）
#
#  架构：只验 linux/amd64（GitHub-hosted runner 原生架构）。arm64 要跑 QEMU，
#  而本方案的核心是 overlay 持久化，模拟环境下的结论不可信 —— 宁可不测也不给
#  假绿灯；arm64 的真实覆盖由构建工作流在原生 ARM runner 上负责。
#
#  触发：每天 UTC 18:30（北京时间 02:30）与手动触发。本工作流只写报告，不构建。
# ==============================================================================

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch: {}

# 让它跑完再排下一次：中途取消会留下残缺的报告
concurrency:
  group: published
  cancel-in-progress: false

env:
  IMAGE_NAME: baota
  REPORT: .github/reports/report.md
  HC: .github/scripts/check
  CHANNELS: image/channels.conf

jobs:
  # ── 1) 从通道声明表生成「要验的通道」矩阵 ──────────────────────────────────
  prep:
    name: 🔖 读取通道与已发布版本
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔖 解析通道表与 VERSION 文件
        id: plan
        run: |
          set -euo pipefail
          matrix='[]'
          while read -r line channel vfile url probe tag base; do
            [ -n "${line:-}" ] || continue
            [ -f "${vfile}" ] || { echo "::error::缺少版本文件 ${vfile}"; exit 1; }
            ver=$(tr -d '[:space:]' < "${vfile}")
            [ -n "${ver}" ] || { echo "::error::${vfile} 为空"; exit 1; }
            matrix=$(jq -c --arg line "${line}" --arg channel "${channel}" --arg version "${ver}" \
              '. + [{line:$line, channel:$channel, version:$version}]' <<< "${matrix}")
            echo "${line} ${channel} 已发布版本 ${ver}"
          done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")
          echo "matrix=$(jq -c . <<< "${matrix}")" >> "$GITHUB_OUTPUT"

  # ── 2) 每个通道并行验证（互不依赖，UI 并排、各自可见进度） ──────────────────
  verify:
    name: 📦 验证 ${{ matrix.channel }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔬 运行回归验证（${{ matrix.channel }} / ${{ matrix.version }}）
        id: verify
        continue-on-error: true
        run: |
          bash "${HC}/published.sh" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}" \
            "${{ matrix.version }}" \
            "/tmp/report-${{ matrix.line }}.md"

      - name: 📄 记录结果
        if: always()
        run: |
          printf '%s\n' '${{ steps.verify.outcome }}' > "/tmp/outcome-${{ matrix.line }}.txt"
          echo "${{ matrix.channel }} 结果：${{ steps.verify.outcome }}"

      - name: 📤 上传报告片段
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-${{ matrix.line }}
          path: |
            /tmp/report-${{ matrix.line }}.md
            /tmp/outcome-${{ matrix.line }}.txt
          if-no-files-found: warn
          retention-days: 7

  # ── 3) 汇总各通道结果、生成并回写 .github/reports/report.md ────────────────
  #  if: always() —— 即使某通道验证失败，也要把失败现场写进报告
  collect:
    name: 📝 汇总并回写报告
    needs: [prep, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          # 显式检出 main：下面 rebase 后是 `git push origin HEAD:main`，
          # 而 HEAD 落在哪个分支取决于触发时选的分支
          ref: main
          fetch-depth: 0

      - name: 📥 下载报告片段
        uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/reports

      # rebase 必须在「生成 / 修改任何仓库文件」之前执行：此时 working tree 干净。
      # 否则报告 / README 已处于 modified，git rebase 会因 dirty tree 中止
      - name: 🔄 同步 main（rebase）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: 📝 生成报告
        run: |
          set -euo pipefail
          {
            echo '# 📊 已发布镜像每日验证报告'
            echo
            echo '> 本文件由 `.github/workflows/check.yml` 自动生成，每次运行整体覆盖（不追加）。'
            echo
            echo "- 生成时间（UTC）：$(date -u '+%F %T')"
            echo "- 触发方式：${{ github.event_name }}"
            echo '- 验证平台：linux/amd64（GitHub-hosted runner；arm64 镜像不在本报告覆盖范围内）'
            echo "- 验证脚本：\`${HC}/published.sh\`"
            echo
            echo '## 概要'
            echo
            echo '| 通道 | 镜像 | 结果 |'
            echo '|---|---|---|'
            while read -r line channel vfile url probe tag base; do
              [ -n "${line:-}" ] || continue
              ver=$(tr -d '[:space:]' < "${vfile}")
              outcome=$(cat "/tmp/reports/report-${line}/outcome-${line}.txt" 2> /dev/null || echo 'missing')
              case "${outcome}" in
                success) icon='✅' ;;
                missing) icon='⚠️' ;;
                *)       icon='❌' ;;
              esac
              echo "| ${channel}（${line}） | \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${ver}\` | ${icon} |"
            done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")
            echo
            echo '---'
            echo
            while read -r line channel vfile url probe tag base; do
              [ -n "${line:-}" ] || continue
              ver=$(tr -d '[:space:]' < "${vfile}")
              echo "## ${channel}（${line}，${ver}）"
              echo
              cat "/tmp/reports/report-${line}/report-${line}.md" 2> /dev/null \
                || echo '_（该通道未产出报告，见构建日志）_'
              echo
              echo '---'
              echo
            done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")
          } > "${{ env.REPORT }}"

          echo '--- 报告已生成（前 30 行）---'
          head -n 30 "${{ env.REPORT }}"

      - name: ✏️ 回写报告与 README
        run: |
          set -euo pipefail
          python3 .github/scripts/report.py "${{ env.REPORT }}"
          git add "${{ env.REPORT }}" README.md

          echo '--- 待提交变更 ---'
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo '报告内容无变化，跳过提交'
            exit 0
          fi
          git commit -m "docs: 更新每日镜像验证报告 $(date -u '+%F')"
          git push origin HEAD:main

      - name: 🚦 判定
        run: |
          set -euo pipefail
          failed=0
          while read -r line channel vfile url probe tag base; do
            [ -n "${line:-}" ] || continue
            outcome=$(cat "/tmp/reports/report-${line}/outcome-${line}.txt" 2> /dev/null || echo 'missing')
            if [ "${outcome}" != 'success' ]; then
              echo "::error::${channel} 回归验证未通过（${outcome}），详见 ${{ env.REPORT }}"
              failed=1
            fi
          done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")
          [ "${failed}" -eq 0 ] || exit 1
          echo '✅ 各通道的已发布镜像均通过回归验证'
