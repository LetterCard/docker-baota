name: Check Upstream Baota Version

# ==============================================================================
#  手动探测上游版本并提交 PR。
#
#  使用方式：
#    1. 在 GitHub 仓库页面 → Actions → Check Upstream Baota Version → Run workflow
#    2. 分支选 main
#    3. 输入上游安装脚本地址（默认 https://download.bt.cn/install/installStable_12.sh）
#    4. 点「运行工作流」
#
#  工作流会：
#    1) 下载你输入的脚本，从安装横幅里提取版本号（例如 12.0.0）
#    2) 与仓库 stable/VERSION 对比
#    3) 如果上游版本比仓库里的新，就自动修改 stable/VERSION 并开一个 PR
#    4) PR 创建后，会自动触发 build-docker.yml 的完整构建 + 健康检查，
#       你能在 PR 里看到镜像是否能正常构建、面板是否能跑起来
#    5) 你点合并后，build-docker.yml 会推送镜像到 DockerHub
#
#  本工作流不会自动合并，也不会推送镜像 —— 它只负责开 PR。
#
#  需要的仓库权限：
#    Actions 默认的 GITHUB_TOKEN 即可创建分支和 PR，
#    但仓库 Settings → Actions → General → Workflow permissions
#    需要勾选 "Read and write permissions"。
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      install_url:
        description: '上游安装脚本地址'
        required: true
        default: 'https://download.bt.cn/install/installStable_12.sh'
        type: string

env:
  VERSION_FILE: stable/VERSION

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取仓库当前版本
        id: current
        run: |
          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE" || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::$VERSION_FILE 为空"
            exit 1
          fi
          if ! printf '%s' "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$VERSION_FILE 内容 '$CURRENT' 不是 x.y.z 格式"
            exit 1
          fi
          echo "value=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "仓库当前版本：${CURRENT}"

      - name: 探测上游版本
        id: upstream
        run: |
          URL="${{ github.event.inputs.install_url }}"
          echo "上游脚本地址：${URL}"

          TMP=$(mktemp)
          if ! curl -fsSL --connect-timeout 10 --max-time 60 "$URL" -o "$TMP"; then
            echo "::error::无法下载上游脚本：${URL}"
            exit 1
          fi

          # 只从安装横幅里取版本号，例如：
          #   | 您正在安装宝塔面板 12.0.0 稳定版
          # 脚本其它位置（如安装计数 API）也会打印版本号，必须限定范围，
          # 否则会把例如 9.3.9 这种内部版本号误当成面板版本。
          BANNER_LINE=$(grep -m1 '您正在安装宝塔面板' "$TMP" || true)
          if [ -z "$BANNER_LINE" ]; then
            echo "::error::未找到安装横幅行，上游可能已修改输出格式"
            exit 1
          fi
          UPSTREAM=$(echo "$BANNER_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          rm -f "$TMP"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::无法从安装横幅中提取版本号"
            exit 1
          fi
          if ! printf '%s' "$UPSTREAM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::提取到的版本号 '$UPSTREAM' 不是 x.y.z 格式"
            exit 1
          fi

          echo "value=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "上游探测版本：${UPSTREAM}"

      - name: 版本比较
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.value }}"
          UPSTREAM="${{ steps.upstream.outputs.value }}"

          # 用 sort -V 做语义化比较
          LATEST=$(printf '%s\n%s\n' "$CURRENT" "$UPSTREAM" | sort -V | tail -1)

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "仓库版本 ${CURRENT} 已是最新（上游 ${UPSTREAM}）"
          else
            echo "result=new-version" >> "$GITHUB_OUTPUT"
            echo "发现新版本：${CURRENT} → ${UPSTREAM}"
          fi

      - name: 更新 VERSION 并创建 PR
        if: steps.compare.outputs.result == 'new-version'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-baota-${{ steps.upstream.outputs.value }}
          commit-message: 'chore: bump baota panel to ${{ steps.upstream.outputs.value }}'
          title: 'chore: 宝塔面板升级至 ${{ steps.upstream.outputs.value }}'
          body: |
            探测到上游版本 `${{ steps.upstream.outputs.value }}`，当前仓库版本为 `${{ steps.current.outputs.value }}`。

            上游脚本：`${{ github.event.inputs.install_url }}`

            合并本 PR 后，`build-docker.yml` 会自动构建并推送 `bugseeker/baota:${{ steps.upstream.outputs.value }}`。

            **请在 PR 的检查结果中确认构建与健康检查通过后再合并。**
          add-paths: |
            stable/VERSION
          delete-branch: true
