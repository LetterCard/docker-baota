name: 🚀 稳定版：构建并发布镜像

# ==============================================================================
#  🚀 [stable 通道] 多架构构建 → 18 项健康检查 → 发布到 DockerHub
#
#    与 release 通道（release-build-push.yml）的区别：
#      - 版本来源：stable/VERSION（version job 每次运行时自动探测校准）
#      - 安装脚本：installStable_12.sh（稳定线 12.x）
#      - 只发布精确版本标签，不打 latest
#      - 安装脚本地址：stable 必须显式拿到它 —— version job 要下载脚本、
#        从横幅里提取版本号（release 走 get_version API，不需要下载）。
#        地址的唯一真源是 stable/Dockerfile 的 ARG INSTALL_URL，
#        由 version job 现场解析；build job 不传 --build-arg，用同一份默认值
#
#  版本来源
#    每次运行探测安装脚本横幅版本：高于 stable/VERSION 就按新版本发布，
#    发布成功后才回写 stable/VERSION（与 release 通道对称：文件永远对应
#    已推送的版本，构建失败时文件不动，可重新手动触发重试）
#
#  触发方式
#    🖱️ 手动触发（唯一方式，定时已移除）。语义 = 手动跑一次探测：
#                  先下载安装脚本取横幅版本，与 stable/VERSION 比对，
#                  有新版本才走完整构建发布，无新版本则到此为止。
#    🔧 可选输入「强制更新」：勾选后跳过「已是最新」判断，无条件走完整
#                  构建发布 —— 用于上游没变但需要重新出镜像的场景，
#                  无需手改 VERSION。版本仍以探测结果为准（探测失败则用
#                  VERSION 当前值）。
#                  ⚠️ 发布前应先看 .github/workflows/drift-check.yml 的报告与
#                  issue，确认上游无关键漂移。
#    发布成功后回写 stable/VERSION；文件变更不触发任何工作流。
#
#  并行多架构
#    amd64 与 arm64 各自跑在「原生」runner 上，总耗时约等于较慢的那个。
#    ⚠️ arm64 要源码编译 Python 3.7（官方无 aarch64 预编译包），
#       在 QEMU 模拟下慢到不实用，所以必须用原生 runner。
#    ⚠️ ubuntu-24.04-arm 只对「公开仓库」免费；仓库转私有请删掉矩阵里的 arm64。
#
#  只发布一个标签
#    用户可见的标签只有 repo:版本。发布走「构建两次 + 按 digest 推送」：
#    第一次只加载到本地供三套健康检查，通过后才第二次构建并按 digest 推入
#    registry（push-by-digest，不创建任何标签），publish 再用 digest 合并成
#    正式标签 —— DockerHub 上永远不会出现 <版本>-amd64 / <版本>-arm64。
#
#  安全底线
#    每个架构都是：本地构建 → 健康检查通过 → 才推送。
#    健康检查失败会终止该 job；publish 依赖两个 job 都成功，
#    所以坏镜像不可能出现在 :版本 这个标签里。
#
#  🔑 所需 Secrets
#    DOCKERHUB_USERNAME  DockerHub 用户名
#    DOCKERHUB_TOKEN     DockerHub Access Token（不要用登录密码）
# ==============================================================================

on:
  # 发布已改为手动，不再定时自动发布。
  # 目的：上游（宝塔官方 / Debian 基础镜像）一旦出问题，自动发布会把坏镜像直接
  # 分发给用户。改为手动后，发布前必然先看到 .github/workflows/drift-check.yml
  # 的报告与 issue，由人确认无关键漂移后再触发本工作流。
  #
  # 唯一的输入项是「强制更新」：它只影响「是否跳过『已是最新』判断」，
  # 不改变任何探测 / 构建参数 —— 版本仍来自安装脚本横幅（唯一真源），
  # 不存在「探测用一个脚本、构建用另一个」的隐患
  workflow_dispatch:
    inputs:
      force_update:
        description: '🔧 强制更新：跳过「已是最新」判断，直接重建发布（探测失败则按 VERSION 当前值）'
        type: boolean
        default: false

# 同一时刻只保留最新一次运行，避免两套多架构构建互相抢缓存
concurrency:
  group: stable-build
  cancel-in-progress: true

env:
  # 必须与 stable/docker-compose.yml 里的 image 保持一致
  IMAGE_NAME: baota
  # 这里刻意没有 INSTALL_URL：安装脚本地址的唯一真源是
  # stable/Dockerfile 的 ARG INSTALL_URL 默认值。
  #   · build job  不传 --build-arg，直接用 Dockerfile 的默认值；
  #   · version job 需要它去探测上游版本，从 Dockerfile 现场解析（见该 job）。
  # 在 workflow 里再抄一份，漂移的表现是「探测到的版本」与「实际装出来的
  # 版本」不是同一个 —— 探测 12.1 却按 12.0 装，白跑一整轮双架构构建。

jobs:
  # ---------------------------------------------------------------------------
  # 版本号只有一个来源，抽出来只读一次，两个构建 job 共用。
  #
  # 每次运行探测上游横幅版本并与 stable/VERSION 比对：只自动升版、绝不自动
  # 降级（stable/VERSION 是降级检测的比对基准）。本 job 不回写文件 ——
  # 回写发生在发布成功之后（writeback），保证文件永远对应已推送的版本。
  # ---------------------------------------------------------------------------
  version:
    name: 🔍 探测版本（stable 通道）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      current: ${{ steps.resolve.outputs.current }}
      changed: ${{ steps.resolve.outputs.changed }}
      probe: ${{ steps.resolve.outputs.probe }}
      install_url: ${{ steps.install_url.outputs.url }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      # ---- 安装脚本地址：唯一真源是 stable/Dockerfile 的 ARG ----
      #
      # 与 release 通道不同，stable 必须拿到这个地址：本 job 要下载它、从横幅里
      # 提取版本号（release 走 get_version API，不需要下载脚本，所以它的
      # workflow 里根本没有这一项）。
      #
      # 从 Dockerfile 现场解析，而不是在 workflow 里再抄一份默认值：
      # 两处漂移的表现是「探测到的版本」与「实际装出来的版本」不是同一个 ——
      # 探测到 12.1 却按 12.0 构建，健康检查的版本校验会拦下，但白跑一整轮
      # 双架构构建（30 分钟起）。
      - name: 🔗 读取安装脚本地址（取自 Dockerfile）
        id: install_url
        run: |
          URL=$(sed -n 's/^ARG INSTALL_URL=//p' stable/Dockerfile | head -1)
          if [ -z "${URL}" ]; then
            echo "::error::无法从 stable/Dockerfile 解析 ARG INSTALL_URL"
            exit 1
          fi
          case "${URL}" in
            http://*|https://*) ;;
            *) echo "::error::解析到的安装脚本地址不像 URL：${URL}"; exit 1 ;;
          esac
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "安装脚本：${URL}"

      - name: 🔍 探测上游版本并与 VERSION 比对
        id: resolve
        run: |
          # 地址由上一步从 stable/Dockerfile 解析而来（那里是唯一真源）
          INSTALL_URL='${{ steps.install_url.outputs.url }}'

          VER=$(tr -d '[:space:]' < stable/VERSION)
          if [ -z "$VER" ]; then
            echo "::error::stable/VERSION 为空"
            exit 1
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号应为 x.y.z 格式，当前为 ${VER}"
            exit 1
          fi
          echo "current=${VER}" >> "$GITHUB_OUTPUT"

          # 探测安装脚本横幅里的实际版本
          ACTUAL=""
          TMP=$(mktemp)
          if curl -fsSL --connect-timeout 10 --max-time 60 "$INSTALL_URL" -o "$TMP" 2>/dev/null; then
            ACTUAL=$(grep -m1 '您正在安装宝塔面板' "$TMP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            rm -f "$TMP"
          else
            rm -f "$TMP"
          fi

          CHANGED=false
          if [ -z "$ACTUAL" ]; then
            echo "probe=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::无法探测上游版本（${INSTALL_URL}），按 stable/VERSION(${VER}) 继续；若上游已更新，健康检查的版本校验会拦住"
          else
            echo "probe=ok" >> "$GITHUB_OUTPUT"
            if [ "$ACTUAL" != "$VER" ]; then
              # 语义比较：只自动升版。横幅低于 VERSION（官方回滚或提取异常）时
              # 绝不自动降级 —— stable/VERSION 此时就是比对基准
              LATEST=$(printf '%s\n%s\n' "$VER" "$ACTUAL" | sort -V | tail -1)
              if [ "$LATEST" = "$ACTUAL" ]; then
                echo "::warning::发现上游新版本：${VER} → ${ACTUAL}，将按新版本构建发布"
                VER=$ACTUAL
                CHANGED=true
              else
                echo "::warning::上游横幅版本(${ACTUAL}) 低于 stable/VERSION(${VER})，"
                echo "::warning::可能是官方回滚或提取异常，绝不自动降级，按 ${VER} 继续"
              fi
            fi
          fi

          # 🔧 强制更新：手动勾选后跳过「已是最新」判断，无条件进入构建发布。
          # 版本仍以探测结果为准（探测失败则用 VERSION 当前值）——
          # 强制的是「重建发布」这个动作，不是编造版本号
          if [ '${{ inputs.force_update }}' = 'true' ]; then
            CHANGED=true
            echo "🔧 强制更新模式：跳过版本比对，无条件构建发布（版本 ${VER}）"
          fi

          echo "value=${VER}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "宝塔版本：${VER}（changed=${CHANGED}）"

      - name: 📋 输出摘要
        run: |
          CURRENT="${{ steps.resolve.outputs.current }}"
          VALUE="${{ steps.resolve.outputs.value }}"
          PROBE="${{ steps.resolve.outputs.probe }}"
          CHANGED="${{ steps.resolve.outputs.changed }}"
          FORCE='${{ inputs.force_update }}'

          if [ "${FORCE}" = 'true' ]; then
            # 强制更新：探测到什么用什么，探测失败用 VERSION 当前值
            TEXT="🔧 强制更新：跳过版本比对，按 ${VALUE} 重建发布"
          else
            # 只有探测到新版本才进入构建，与触发方式无关（手动 = 手动跑一次探测）。
            # 探测失败同样阻断：无法确认上游状态时按旧版本继续构建，
            # 打出的镜像可能与上游不一致，宁可不发，等下次运行自动重试
            case "${PROBE}:${CHANGED}" in
              ok:true)  TEXT="🎉 发现上游新版本：${CURRENT} → ${VALUE}，将按新版本发布" ;;
              ok:false) TEXT="✅ 已是最新（${VALUE}），本次不构建" ;;
              failed:*) TEXT="⚠️ 探测失败，无法确认上游状态，本次不构建；稍后可手动重跑" ;;
              *)        TEXT="❓ 未知状态，本次不构建" ;;
            esac
          fi
          {
            echo "### 🔍 stable 版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| stable/VERSION | \`${CURRENT}\` |"
            echo "| 上游横幅版本 | \`${VALUE}\` |"
            echo "| 强制更新 | ${FORCE} |"
            echo "| 结果 | ${TEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 🧹 静态检查：shellcheck + 语法 + YAML
  #
  # 本地 `make lint` 在没装 shellcheck 时会「跳过」，等于这道检查长期没人真正跑过。
  # 放到 CI 里先装工具再跑，脚本质量才有持续保障。
  #
  # 与版本探测无关，所以**无条件运行**：即使本次不发布镜像，
  # 代码问题也能在当天被发现，而不是等到下次发布才暴露
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 静态检查（shellcheck + 语法 + YAML）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔧 安装检查工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version
          python3 -c "import yaml; print('PyYAML ok')"

      - name: 🧹 运行静态检查
        run: make lint

  build:
    name: 🏗️ 构建 linux/${{ matrix.arch }}
    needs: [version, lint]
    # 只在「探测到新版本」或「手动勾选强制更新」时构建：
    #   - 否则每次手动触发都会空跑一整轮双架构构建（单次约 40 分钟），
    #     还要重复覆盖 DockerHub 上已有的同一个标签。
    # 强制更新由 version job 直接把 changed 置 true，下游 if 无需感知
    if: needs.version.outputs.changed == 'true'
    timeout-minutes: 180
    strategy:
      # 不要 fail-fast：让两个架构都跑完，一次就能看到各自的问题
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # 原生 ARM runner，避免 QEMU 模拟下编译 Python 的漫长等待
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🖥️ 确认 runner 原生架构
        run: |
          echo "runner 架构：$(uname -m)"
          echo "目标架构：${{ matrix.arch }}"
          case "${{ matrix.arch }}-$(uname -m)" in
            amd64-x86_64|arm64-aarch64) echo "✅ 原生构建，无需模拟" ;;
            *) echo "::error::runner 架构与目标不匹配，会退化为 QEMU 模拟"; exit 1 ;;
          esac

      - name: 🔧 准备 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # ---- 第一次构建：只加载到本地，供三套健康检查使用 ----
      # 同时把构建缓存写进 GHA 缓存（按架构分 scope），第二次按 digest 推送会命中，
      # 几乎不再重新编译
      - name: 🏗️ 构建镜像（加载到本地，供健康检查）
        run: |
          echo "构建 baota:candidate（linux/${{ matrix.arch }}）"
          # INSTALL_URL 刻意不传：用 stable/Dockerfile 里 ARG 的默认值，
          # 与 version job 探测时解析到的是同一份（见 env 处的说明）
          docker buildx build \
            --file ./stable/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.version.outputs.value }}" \
            --tag "baota:candidate" \
            --cache-from "type=gha,scope=stable-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=stable-${{ matrix.arch }},mode=max" \
            .
          docker image inspect --format '本地镜像 ID：{{.Id}}' baota:candidate

      # ---- 三道验证：任一失败，本 job 即失败，推送不会发生 ----
      #
      # 三套检查测的是三个互不相关的失效面（功能完整性 / 挂载与降级 / 版本演进），
      # 各自启停独立容器（容器名按 PID 区分：baota-healthcheck-<pid> /
      # baota-mounts-<pid> / baota-upgrade-<pid>，不会撞车），可以并行跑：
      #   - 单 runner 启 3 个 baota 容器约 1.5 GB 内存，amd64/arm64 runner 都够
      #   - 容器名按 PID 区分，不会冲突
      #   - 任一子任务非零退出 → set -e + wait 让 step 失败，不掩盖问题
      # 串行改并行一般能省 5~10 分钟（每套检查都要 systemd 起来 + 宝塔初始化）
      - name: 🩺 三套健康检查并行（功能 / 挂载 / 升级）
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP:-/tmp}/hc-logs"
          mkdir -p "${LOG_DIR}"
          VER="${{ needs.version.outputs.value }}"

          # 后台启动三套，每套单独写日志；前台 wait 等齐；任一非零则整步失败
          bash .github/scripts/health-check/run.sh core    "baota:candidate" "${VER}" > "${LOG_DIR}/core.log"    2>&1 & PID_CORE=$!
          bash .github/scripts/health-check/run.sh mounts  "baota:candidate"                > "${LOG_DIR}/mounts.log"  2>&1 & PID_MOUNTS=$!
          bash .github/scripts/health-check/run.sh upgrade "baota:candidate" "${VER}" > "${LOG_DIR}/upgrade.log" 2>&1 & PID_UPGRADE=$!

          FAILED=0
          wait "${PID_CORE}"    || { echo "::error::core 检查失败，日志见 ${LOG_DIR}/core.log";    FAILED=1; }
          wait "${PID_MOUNTS}"  || { echo "::error::mounts 检查失败，日志见 ${LOG_DIR}/mounts.log";  FAILED=1; }
          wait "${PID_UPGRADE}" || { echo "::error::upgrade 检查失败，日志见 ${LOG_DIR}/upgrade.log"; FAILED=1; }

          # 任一失败：先把日志吐到 step 输出，再非零退出 —— 不让并行"静默吃掉"问题
          if [ "${FAILED}" -ne 0 ]; then
            for f in core mounts upgrade; do
              echo "===== ${f}.log (tail 80) ====="
              tail -n 80 "${LOG_DIR}/${f}.log" || true
            done
            exit 1
          fi
          echo "✅ 三套健康检查全过"

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 第二次构建：按 digest 推送，不产生任何 arch 标签 ----
      #
      # 为什么构建两次（取舍，不是技术限制）：buildx 一次调用里没法「测完再推」。
      # 这里先构建并 load 到本机、三套健康检查通过后才第二次推送；第二次命中
      # 第一次刚写入的 GHA 缓存，几乎不再重新编译。
      # push-by-digest=true：只把镜像按 digest 存进 registry，不创建任何标签 ——
      # DockerHub 上永远不会出现 <版本>-amd64 / <版本>-arm64。
      - name: 📤 按 digest 推送（不产生标签）
        id: push
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "推送 linux/${{ matrix.arch }}（按 digest，无标签）"
          # INSTALL_URL 同第一次构建，用 Dockerfile 默认值，不在这里传
          docker buildx build \
            --file ./stable/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.version.outputs.value }}" \
            --output "type=image,name=${REPO},push=true,push-by-digest=true" \
            --metadata-file "/tmp/meta-${{ matrix.arch }}.json" \
            --cache-from "type=gha,scope=stable-${{ matrix.arch }}" \
            .
          DIGEST=$(jq -r '."containerimage.digest"' "/tmp/meta-${{ matrix.arch }}.json")
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::取 digest 失败：${DIGEST}"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          printf '%s\n' "${DIGEST}" > "/tmp/digests/${{ matrix.arch }}"
          {
            echo "### 🏗️ linux/${{ matrix.arch }}"
            echo ""
            echo "- 按 digest 推送：\`${REPO}@${DIGEST}\`（无 arch 标签）"
            echo "- 字节与健康检查对象同源（复用同一份 GHA 缓存）"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ ${{ matrix.arch }} digest: ${DIGEST}"

      - name: 📦 上传 digest 产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 合并成唯一的多架构标签 repo:版本
  # 两个 build job 必须都成功，任一架构的健康检查失败都到不了这一步。
  # 跳过条件与 build 相同：定时触发且没有新版本时，这里同样不运行
  # ---------------------------------------------------------------------------
  publish:
    name: 🚀 合并多架构并发布（仅 <版本> 标签）
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.manifest.outputs.repo }}
      tag: ${{ steps.manifest.outputs.tag }}
    steps:
      - name: 📥 下载 digest 产物
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 合并多架构 manifest
        id: manifest
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          VER="${{ needs.version.outputs.value }}"

          AMD64=$(tr -d '[:space:]' < /tmp/digests/amd64)
          ARM64=$(tr -d '[:space:]' < /tmp/digests/arm64)
          echo "amd64: ${AMD64}"
          echo "arm64: ${ARM64}"
          [ -n "$AMD64" ] && [ -n "$ARM64" ] || { echo "::error::缺少某个架构的 digest"; exit 1; }

          # 约定：stable 是稳定线，只打版本号标签；latest 由 release 通道独占，
          # 这里绝对不能加 -t "${REPO}:latest" —— 会把 latest 误指向 stable
          docker buildx imagetools create -t "${REPO}:${VER}" \
            "${REPO}@${AMD64}" \
            "${REPO}@${ARM64}"

          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: 📋 输出摘要
        run: |
          REPO="${{ steps.manifest.outputs.repo }}"
          TAG="${{ steps.manifest.outputs.tag }}"

          {
            echo "### 🚀 发布完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${REPO}:${TAG}\` |"
            echo "| 宝塔版本 | ${{ needs.version.outputs.value }} |"
            echo "| 架构 | linux/amd64、linux/arm64 |"
            echo ""
            echo "本工作流不推送 latest 标签，compose 里请使用精确版本标签。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "已发布 ${REPO}:${TAG}"
          docker buildx imagetools inspect "${REPO}:${TAG}"

  # ---------------------------------------------------------------------------
  # ✏️ 发布成功之后才回写 stable/VERSION —— 与 release 通道对称：
  # 文件永远对应「已推送」的版本；构建失败时文件不动，下次运行自动重试。
  #
  # 关键约束（之前踩过坑）：
  #   1. 必须先 git fetch + rebase 最新 main，再 commit。
  #      publish 跑完通常要 30+ 分钟，期间若有人在 main 上提交（手动改回、
  #      其他 bot、并发 workflow 调度等），bot checkout 时拿到的不是最新 HEAD，
  #      直接 push 会被 non-fast-forward 拒绝。
  #   2. git push 失败必须让 step 真正失败（exit 1）。
  #      之前用 `if git push; then ... else ::warning:: ... fi` 的写法，
  #      bash 把整体退出码取最后一个 echo 的（成功），于是 step 显示绿色✓
  #      但 push 其实没生效。下次运行还会再探测一次"不一致"，重新走一遍
  #      build → publish → writeback，整轮 30 分钟构建浪费。
  # ---------------------------------------------------------------------------
  writeback:
    name: ✏️ 回写 stable/VERSION
    needs: [version, publish]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          # 完整历史让 rebase 能拿到共同祖先，否则会报 "invalid upstream"
          fetch-depth: 0

      - name: ✏️ 回写已发布的版本号
        run: |
          set -euo pipefail

          VER="${{ needs.publish.outputs.tag }}"
          # publish.outputs.tag 为空 = 上游 job 链路断了，不再写回（让 step 失败便于排查）
          [ -n "${VER}" ] || { echo "::error::publish.outputs.tag 为空，上游未产生新版本"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1) 同步最新 main，避免与并发 push 形成 non-fast-forward。
          #    rebase 冲突在这里几乎不可能（只有 VERSION 一处文本变更），
          #    真撞上时直接报错退出，比强行 --force 安全得多。
          git fetch origin main
          git rebase origin/main

          # 2) 再次检查：rebase 后若 VERSION 已是目标值，说明并发运行已先一步
          #    回写完毕（典型场景：两次手动触发重叠），
          #    无需重复 commit，直接成功退出。
          CURRENT=$(tr -d '[:space:]' < stable/VERSION || true)
          if [ "${CURRENT}" = "${VER}" ]; then
            echo "stable/VERSION 已是 ${VER}，并发回写已生效，跳过"
            exit 0
          fi

          printf '%s\n' "${VER}" > stable/VERSION
          git add stable/VERSION
          git commit -m "chore: release baota ${VER} (writeback stable/VERSION)"

          # 3) 直接 push，不再用 if-then-else 包裹。
          #    push 失败（非 fast-forward / 分支保护 / 权限不足）会原样
          #    冒泡成 step 失败：红❌ + ::error::，下次运行会重新探测并重试。
          git push origin HEAD:main
          echo "已回写 stable/VERSION = ${VER}"

      - name: 📋 输出摘要
        run: |
          echo "### ✏️ stable/VERSION 已回写为 \`${{ needs.publish.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
