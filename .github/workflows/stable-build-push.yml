name: 🚀 稳定版：构建并发布镜像

# ==============================================================================
#  🚀 [stable 通道] 多架构构建 → 19 项健康检查 → 发布到 DockerHub
#
#    与 release 通道（release-build-push.yml）的区别：
#      - 版本来源：stable/VERSION（version job 每次运行时自动探测校准）
#      - 安装脚本：installStable_12.sh（稳定线 12.x）
#      - 只发布精确版本标签，不打 latest
#
#  版本来源
#    每次运行探测安装脚本横幅版本：高于 stable/VERSION 就按新版本发布，
#    发布成功后才回写 stable/VERSION（与 release 通道对称：文件永远对应
#    已推送的版本，构建失败时文件不动，下次运行自动重试）
#
#  触发方式
#    🗓️ 每周一     UTC 02:00（北京时间周一 10:00）自动运行一次。先探测上游
#                  横幅版本：没有新版本就空转结束，有新版本才走完整构建发布。
#                  与 release 通道的每日 UTC 17:00 错开。
#    🖱️ 手动       随时在页面触发，流程与定时一致，但无论版本是否变化都会
#                  重新构建发布一次（需要「不改版本号也重建」时用这个）。
#    发布成功后回写 stable/VERSION；文件变更不触发任何工作流。
#
#  并行多架构
#    amd64 与 arm64 各自跑在「原生」runner 上，总耗时约等于较慢的那个。
#    ⚠️ arm64 要源码编译 Python 3.7（官方无 aarch64 预编译包），
#       在 QEMU 模拟下慢到不实用，所以必须用原生 runner。
#    ⚠️ ubuntu-24.04-arm 只对「公开仓库」免费；仓库转私有请删掉矩阵里的 arm64。
#
#  只发布一个标签
#    用户可见的标签只有 repo:版本。两个架构各推一个固定后缀 tag
#    （<版本>-amd64 / <版本>-arm64）作为 publish 合并的素材，
#    同 tag 同 digest 幂等覆盖，不会累积。
#
#  安全底线
#    每个架构都是：本地构建 → 健康检查通过 → 才推送。
#    健康检查失败会终止该 job；publish 依赖两个 job 都成功，
#    所以坏镜像不可能出现在 :版本 这个标签里。
#
#  🔑 所需 Secrets
#    DOCKERHUB_USERNAME  DockerHub 用户名
#    DOCKERHUB_TOKEN     DockerHub Access Token（不要用登录密码）
# ==============================================================================

on:
  schedule:
    # 每周一 UTC 02:00（北京时间周一 10:00）。
    # 与 release 通道的每日 UTC 17:00（北京时间 1 点）错开，避免两个通道同时构建
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      install_url:
        description: '安装脚本地址（手动运行时用于校准 VERSION；默认与 Dockerfile 一致）'
        required: false
        default: 'https://download.bt.cn/install/installStable_12.sh'
        type: string

# 同一时刻只保留最新一次运行，避免两套多架构构建互相抢缓存
concurrency:
  group: stable-build
  cancel-in-progress: true

env:
  # 必须与 stable/docker-compose.yml 里的 image 保持一致
  IMAGE_NAME: baota
  INSTALL_URL: ${{ inputs.install_url || 'https://download.bt.cn/install/installStable_12.sh' }}

jobs:
  # ---------------------------------------------------------------------------
  # 版本号只有一个来源，抽出来只读一次，两个构建 job 共用。
  #
  # 每次运行探测上游横幅版本并与 stable/VERSION 比对：只自动升版、绝不自动
  # 降级（stable/VERSION 是降级检测的比对基准）。本 job 不回写文件 ——
  # 回写发生在发布成功之后（writeback），保证文件永远对应已推送的版本。
  # ---------------------------------------------------------------------------
  version:
    name: 🔍 探测版本（stable 通道）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      current: ${{ steps.resolve.outputs.current }}
      changed: ${{ steps.resolve.outputs.changed }}
      probe: ${{ steps.resolve.outputs.probe }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔍 探测上游版本并与 VERSION 比对
        id: resolve
        run: |
          VER=$(tr -d '[:space:]' < stable/VERSION)
          if [ -z "$VER" ]; then
            echo "::error::stable/VERSION 为空"
            exit 1
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号应为 x.y.z 格式，当前为 ${VER}"
            exit 1
          fi
          echo "current=${VER}" >> "$GITHUB_OUTPUT"

          # 探测安装脚本横幅里的实际版本
          ACTUAL=""
          TMP=$(mktemp)
          if curl -fsSL --connect-timeout 10 --max-time 60 "$INSTALL_URL" -o "$TMP" 2>/dev/null; then
            ACTUAL=$(grep -m1 '您正在安装宝塔面板' "$TMP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            rm -f "$TMP"
          else
            rm -f "$TMP"
          fi

          CHANGED=false
          if [ -z "$ACTUAL" ]; then
            echo "probe=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::无法探测上游版本（${INSTALL_URL}），按 stable/VERSION(${VER}) 继续；若上游已更新，健康检查的版本校验会拦住"
          else
            echo "probe=ok" >> "$GITHUB_OUTPUT"
            if [ "$ACTUAL" != "$VER" ]; then
              # 语义比较：只自动升版。横幅低于 VERSION（官方回滚或提取异常）时
              # 绝不自动降级 —— stable/VERSION 此时就是比对基准
              LATEST=$(printf '%s\n%s\n' "$VER" "$ACTUAL" | sort -V | tail -1)
              if [ "$LATEST" = "$ACTUAL" ]; then
                echo "::warning::发现上游新版本：${VER} → ${ACTUAL}，将按新版本构建发布"
                VER=$ACTUAL
                CHANGED=true
              else
                echo "::warning::上游横幅版本(${ACTUAL}) 低于 stable/VERSION(${VER})，"
                echo "::warning::可能是官方回滚或提取异常，绝不自动降级，按 ${VER} 继续"
              fi
            fi
          fi

          echo "value=${VER}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "宝塔版本：${VER}（changed=${CHANGED}）"

      - name: 📋 输出摘要
        run: |
          CURRENT="${{ steps.resolve.outputs.current }}"
          VALUE="${{ steps.resolve.outputs.value }}"
          PROBE="${{ steps.resolve.outputs.probe }}"
          CHANGED="${{ steps.resolve.outputs.changed }}"

          # 手动触发 = 用户明确要求发布（版本未变也重新构建）；
          # 定时触发 = 仅在探测到新版本（changed=true）时才有后续构建任务
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL_NOTE="，手动触发将重新构建发布"
          else
            MANUAL_NOTE="，定时触发本次不构建"
          fi

          case "${PROBE}:${CHANGED}" in
            ok:true)  TEXT="🎉 发现上游新版本：${CURRENT} → ${VALUE}，将按新版本发布" ;;
            ok:false) TEXT="✅ 已是最新（${VALUE}）${MANUAL_NOTE}" ;;
            failed:*) TEXT="⚠️ 探测失败，按 stable/VERSION（${VALUE}）继续${MANUAL_NOTE}" ;;
            *)        TEXT="❓ 未知状态" ;;
          esac
          {
            echo "### 🔍 stable 版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| stable/VERSION | \`${CURRENT}\` |"
            echo "| 上游横幅版本 | \`${VALUE}\` |"
            echo "| 结果 | ${TEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 🧹 静态检查：shellcheck + 语法 + YAML
  #
  # 本地 `make lint` 在没装 shellcheck 时会「跳过」，等于这道检查长期没人真正跑过。
  # 放到 CI 里先装工具再跑，脚本质量才有持续保障。
  #
  # 与版本探测无关，所以**无条件运行**：即使本次不发布镜像，
  # 代码问题也能在当天被发现，而不是等到下次发布才暴露
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 静态检查（shellcheck + 语法 + YAML）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔧 安装检查工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version
          python3 -c "import yaml; print('PyYAML ok')"

      - name: 🧹 运行静态检查
        run: make lint

  build:
    name: 🏗️ 构建 linux/${{ matrix.arch }}
    needs: [version, lint]
    # 定时触发时只在探测到新版本才构建，否则每周都要空跑一整轮双架构构建
    # （单次约 40 分钟，还要重复覆盖 DockerHub 上已有的同一个标签）。
    # 手动触发则总是构建，方便在不改版本号的情况下重建镜像。
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.changed == 'true'
    timeout-minutes: 180
    strategy:
      # 不要 fail-fast：让两个架构都跑完，一次就能看到各自的问题
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # 原生 ARM runner，避免 QEMU 模拟下编译 Python 的漫长等待
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🖥️ 确认 runner 原生架构
        run: |
          echo "runner 架构：$(uname -m)"
          echo "目标架构：${{ matrix.arch }}"
          case "${{ matrix.arch }}-$(uname -m)" in
            amd64-x86_64|arm64-aarch64) echo "✅ 原生构建，无需模拟" ;;
            *) echo "::error::runner 架构与目标不匹配，会退化为 QEMU 模拟"; exit 1 ;;
          esac

      - name: 🔧 准备 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # ---- 第一次构建：只加载到本地，供三套健康检查使用 ----
      # 同时把构建缓存写进 GHA 缓存（按架构分 scope），第二次按 digest 推送会命中，
      # 几乎不再重新编译
      - name: 🏗️ 构建镜像（加载到本地，供健康检查）
        run: |
          echo "构建 baota:candidate（linux/${{ matrix.arch }}）"
          docker buildx build \
            --file ./stable/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.version.outputs.value }}" \
            --build-arg "INSTALL_URL=${{ env.INSTALL_URL }}" \
            --tag "baota:candidate" \
            --cache-from "type=gha,scope=${{ matrix.arch }}" \
            --cache-to "type=gha,scope=${{ matrix.arch }},mode=max" \
            .
          docker image inspect --format '本地镜像 ID：{{.Id}}' baota:candidate

      # ---- 三道验证：任一失败，本 job 即失败，推送不会发生 ----
      - name: 🩺 验证 1/3：功能完整性
        run: |
          bash .github/scripts/health-check/run.sh core \
            "baota:candidate" "${{ needs.version.outputs.value }}"

      # 上面 19 项只覆盖了「命名卷 + 单挂 /data」一种挂载方式。
      # 这里补两类同样致命、但那边测不到的场景：
      #   混合挂载（./data:/data + ./system:/data/system）能否正常工作
      #   持久化根被挂成只读时，是否真的被识别为降级而不是「写入静默丢失」
      - name: 🧪 验证 2/3：挂载方式与降级场景
        run: bash .github/scripts/health-check/run.sh mounts "baota:candidate"

      # 版本护栏、升级前快照、面板启动器刷新这三段**只在镜像版本变化时执行**，
      # 全新卷永远走不到 —— 上面两套检查都覆盖不到。
      # 这里通过改写持久化层里的版本记录，把「升级」与「降级」两条分支都跑一遍，
      # 确认快照真的生成（且内容完整）、启动器真的被刷新、降级不会阻断启动
      - name: 🔼 验证 3/3：升级与降级路径
        run: |
          bash .github/scripts/health-check/run.sh upgrade \
            "baota:candidate" "${{ needs.version.outputs.value }}"

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 第二次构建：按 digest 推送，不产生任何 arch 标签 ----
      #
      # 为什么构建两次（取舍，不是技术限制）：buildx 一次调用里没法「测完再推」。
      # 这里先构建并 load 到本机、三套健康检查通过后才第二次推送；第二次命中
      # 第一次刚写入的 GHA 缓存，几乎不再重新编译。
      # push-by-digest=true：只把镜像按 digest 存进 registry，不创建任何标签 ——
      # DockerHub 上永远不会出现 <版本>-amd64 / <版本>-arm64。
      - name: 📤 按 digest 推送（不产生标签）
        id: push
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "推送 linux/${{ matrix.arch }}（按 digest，无标签）"
          docker buildx build \
            --file ./stable/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.version.outputs.value }}" \
            --build-arg "INSTALL_URL=${{ env.INSTALL_URL }}" \
            --output "type=image,name=${REPO},push=true,push-by-digest=true" \
            --metadata-file "/tmp/meta-${{ matrix.arch }}.json" \
            --cache-from "type=gha,scope=${{ matrix.arch }}" \
            .
          DIGEST=$(jq -r '."containerimage.digest"' "/tmp/meta-${{ matrix.arch }}.json")
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::取 digest 失败：${DIGEST}"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          printf '%s\n' "${DIGEST}" > "/tmp/digests/${{ matrix.arch }}"
          {
            echo "### 🏗️ linux/${{ matrix.arch }}"
            echo ""
            echo "- 按 digest 推送：\`${REPO}@${DIGEST}\`（无 arch 标签）"
            echo "- 字节与健康检查对象同源（复用同一份 GHA 缓存）"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ ${{ matrix.arch }} digest: ${DIGEST}"

      - name: 📦 上传 digest 产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 合并成唯一的多架构标签 repo:版本
  # 两个 build job 必须都成功，任一架构的健康检查失败都到不了这一步。
  # 跳过条件与 build 相同：定时触发且没有新版本时，这里同样不运行
  # ---------------------------------------------------------------------------
  publish:
    name: 🚀 合并多架构并发布（仅 <版本> 标签）
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.manifest.outputs.repo }}
      tag: ${{ steps.manifest.outputs.tag }}
    steps:
      - name: 📥 下载 digest 产物
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 合并多架构 manifest
        id: manifest
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          VER="${{ needs.version.outputs.value }}"

          AMD64=$(tr -d '[:space:]' < /tmp/digests/amd64)
          ARM64=$(tr -d '[:space:]' < /tmp/digests/arm64)
          echo "amd64: ${AMD64}"
          echo "arm64: ${ARM64}"
          [ -n "$AMD64" ] && [ -n "$ARM64" ] || { echo "::error::缺少某个架构的 digest"; exit 1; }

          # 约定：stable 是稳定线，只打版本号标签；latest 由 release 通道独占，
          # 这里绝对不能加 -t "${REPO}:latest" —— 会把 latest 误指向 stable
          docker buildx imagetools create -t "${REPO}:${VER}" \
            "${REPO}@${AMD64}" \
            "${REPO}@${ARM64}"

          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: 📋 输出摘要
        run: |
          REPO="${{ steps.manifest.outputs.repo }}"
          TAG="${{ steps.manifest.outputs.tag }}"

          {
            echo "### 🚀 发布完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${REPO}:${TAG}\` |"
            echo "| 宝塔版本 | ${{ needs.version.outputs.value }} |"
            echo "| 架构 | linux/amd64、linux/arm64 |"
            echo ""
            echo "本工作流不推送 latest 标签，compose 里请使用精确版本标签。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "已发布 ${REPO}:${TAG}"
          docker buildx imagetools inspect "${REPO}:${TAG}"

  # ---------------------------------------------------------------------------
  # ✏️ 发布成功之后才回写 stable/VERSION —— 与 release 通道对称：
  # 文件永远对应「已推送」的版本；构建失败时文件不动，下次运行自动重试。
  # ---------------------------------------------------------------------------
  writeback:
    name: ✏️ 回写 stable/VERSION
    needs: [version, publish]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: ✏️ 回写已发布的版本号
        run: |
          VER="${{ needs.publish.outputs.tag }}"
          printf '%s\n' "$VER" > stable/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable/VERSION
          git commit -m "chore: release baota ${VER} (writeback stable/VERSION)"
          if git push; then
            echo "已回写 stable/VERSION = ${VER}"
          else
            echo "::warning::回写推送失败（分支可能受保护）。镜像 ${VER} 已发布成功；下次运行会再次探测校准并重试回写"
          fi

      - name: 📋 输出摘要
        run: |
          echo "### ✏️ stable/VERSION 已回写为 \`${{ needs.publish.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
