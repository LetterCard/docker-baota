name: 📦 12.0.0：构建并发布镜像

# ==============================================================================
#  📦 [12.0.0 通道] 多架构构建 → 20 项健康检查 → 发布到 DockerHub
#
#    与 13.0.0 通道（13.0.0-build-push.yml）的区别：
#      - 版本来源：dockerfile/12.0.0/VERSION（version job 每次运行时自动探测校准）
#      - 安装脚本：installStable_12.sh（稳定线 12.x）
#      - 只发布精确版本标签，不打 latest
#      - 安装脚本地址：12.0.0 必须显式拿到它 —— version job 要下载脚本、
#        从横幅里提取版本号（13.0.0 走 get_version API，不需要下载）。
#        地址的唯一真源是 dockerfile/12.0.0/Dockerfile 的 ARG INSTALL_URL，
#        由 version job 现场解析；build job 不传 --build-arg，用同一份默认值
#
#  版本来源
#    每次运行探测安装脚本横幅版本：高于 dockerfile/12.0.0/VERSION 就按新版本发布，
#    发布成功后才回写 dockerfile/12.0.0/VERSION（与 13.0.0 通道对称：文件永远对应
#    已推送的版本，构建失败时文件不动，可重新手动触发重试）
#
#  触发方式
#    🖱️ 手动触发（唯一方式，定时已移除）。语义 = 手动跑一次探测：
#                  先下载安装脚本取横幅版本，与 dockerfile/12.0.0/VERSION 比对，
#                  有新版本才走完整构建发布，无新版本则到此为止。
#    🔧 可选输入「强制更新」：勾选后跳过「已是最新」判断，无条件走完整
#                  构建发布 —— 用于上游没变但需要重新出镜像的场景，
#                  无需手改 VERSION。版本仍以探测结果为准（探测失败则用
#                  VERSION 当前值）。
#                  ⚠️ 发布前应先看 .github/workflows/drift.yml 的报告与
#                  issue，确认上游无关键漂移。
#    发布成功后回写 dockerfile/12.0.0/VERSION；文件变更不触发任何工作流。
#
#  并行多架构
#    amd64 与 arm64 各自跑在「原生」runner 上，总耗时约等于较慢的那个。
#    ⚠️ arm64 要源码编译 Python 3.7（官方无 aarch64 预编译包），
#       在 QEMU 模拟下慢到不实用，所以必须用原生 runner。
#    ⚠️ ubuntu-24.04-arm 只对「公开仓库」免费；仓库转私有请删掉矩阵里的 arm64。
#
#  只发布一个标签
#    用户可见的标签只有 repo:版本。发布走「构建两次 + 按 digest 推送」：
#    第一次只加载到本地供三套健康检查，通过后才第二次构建并按 digest 推入
#    registry（push-by-digest，不创建任何标签），publish 再用 digest 合并成
#    正式标签 —— DockerHub 上永远不会出现 <版本>-amd64 / <版本>-arm64。
#
#  安全底线
#    每个架构都是：本地构建 → 健康检查通过 → 才推送。
#    健康检查失败会终止该 job；publish 依赖两个 job 都成功，
#    所以坏镜像不可能出现在 :版本 这个标签里。
#
#  🧩 与通道无关的四步（lint / build / publish / writeback）已抽到
#     .github/workflows/reusable-build-push.yml，由本文件末尾的 release job 调用
#
#  🔑 所需 Secrets
#    DOCKERHUB_USERNAME  DockerHub 用户名
#    DOCKERHUB_TOKEN     DockerHub Access Token（不要用登录密码）
# ==============================================================================

on:
  # 发布已改为手动，不再定时自动发布。
  # 目的：上游（宝塔官方 / Debian 基础镜像）一旦出问题，自动发布会把坏镜像直接
  # 分发给用户。改为手动后，发布前必然先看到 .github/workflows/drift.yml
  # 的报告与 issue，由人确认无关键漂移后再触发本工作流。
  #
  # 唯一的输入项是「强制更新」：它只影响「是否跳过『已是最新』判断」，
  # 不改变任何探测 / 构建参数 —— 版本仍来自安装脚本横幅（唯一真源），
  # 不存在「探测用一个脚本、构建用另一个」的隐患
  workflow_dispatch:
    inputs:
      force_update:
        description: '🔧 强制更新：跳过「已是最新」判断，直接重建发布（探测失败则按 VERSION 当前值）'
        type: boolean
        default: false


# 不取消在途运行：本流水线末尾会把探测到的新版本回写进 VERSION 文件。
# 若在「构建推送成功」之后、「回写 VERSION」之前被取消，版本就永远写不回去，
# 下次仍会重复构建同一个版本。与 13.0.0 通道保持一致
concurrency:
  group: 12.0.0-build
  cancel-in-progress: false

env:
  # 必须与 dockerfile/docker-compose.yml 里的 image 保持一致
  IMAGE_NAME: baota
  # 这里刻意没有 INSTALL_URL：安装脚本地址的唯一真源是
  # dockerfile/12.0.0/Dockerfile 的 ARG INSTALL_URL 默认值。
  #   · build job  不传 --build-arg，直接用 Dockerfile 的默认值；
  #   · version job 需要它去探测上游版本，从 Dockerfile 现场解析（见该 job）。
  # 在 workflow 里再抄一份，漂移的表现是「探测到的版本」与「实际装出来的
  # 版本」不是同一个 —— 探测 12.1 却按 12.0 装，白跑一整轮双架构构建。

jobs:
  # ---------------------------------------------------------------------------
  # 版本号只有一个来源，抽出来只读一次，两个构建 job 共用。
  #
  # 每次运行探测上游横幅版本并与 dockerfile/12.0.0/VERSION 比对：只自动升版、绝不自动
  # 降级（dockerfile/12.0.0/VERSION 是降级检测的比对基准）。本 job 不回写文件 ——
  # 回写发生在发布成功之后（writeback），保证文件永远对应已推送的版本。
  # ---------------------------------------------------------------------------
  version:
    name: 🔍 探测版本（12.0.0 通道）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      current: ${{ steps.resolve.outputs.current }}
      changed: ${{ steps.resolve.outputs.changed }}
      probe: ${{ steps.resolve.outputs.probe }}
      install_url: ${{ steps.install_url.outputs.url }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      # ---- 安装脚本地址：唯一真源是 dockerfile/12.0.0/Dockerfile 的 ARG ----
      #
      # 与 13.0.0 通道不同，12.0.0 必须拿到这个地址：本 job 要下载它、从横幅里
      # 提取版本号（13.0.0 走 get_version API，不需要下载脚本，所以它的
      # workflow 里根本没有这一项）。
      #
      # 从 Dockerfile 现场解析，而不是在 workflow 里再抄一份默认值：
      # 两处漂移的表现是「探测到的版本」与「实际装出来的版本」不是同一个 ——
      # 探测到 12.1 却按 12.0 构建，健康检查的版本校验会拦下，但白跑一整轮
      # 双架构构建（30 分钟起）。
      - name: 🔗 读取安装脚本地址（取自 Dockerfile）
        id: install_url
        run: |
          URL=$(sed -n 's/^ARG INSTALL_URL=//p' dockerfile/12.0.0/Dockerfile | head -1)
          if [ -z "${URL}" ]; then
            echo "::error::无法从 dockerfile/12.0.0/Dockerfile 解析 ARG INSTALL_URL"
            exit 1
          fi
          case "${URL}" in
            http://*|https://*) ;;
            *) echo "::error::解析到的安装脚本地址不像 URL：${URL}"; exit 1 ;;
          esac
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "安装脚本：${URL}"

      - name: 🔍 探测上游版本并与 VERSION 比对
        id: resolve
        run: |
          # 地址由上一步从 dockerfile/12.0.0/Dockerfile 解析而来（那里是唯一真源）
          INSTALL_URL='${{ steps.install_url.outputs.url }}'

          VER=$(tr -d '[:space:]' < dockerfile/12.0.0/VERSION)
          if [ -z "$VER" ]; then
            echo "::error::dockerfile/12.0.0/VERSION 为空"
            exit 1
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号应为 x.y.z 格式，当前为 ${VER}"
            exit 1
          fi
          echo "current=${VER}" >> "$GITHUB_OUTPUT"

          # 探测安装脚本横幅里的实际版本
          ACTUAL=""
          TMP=$(mktemp)
          if curl -fsSL --connect-timeout 10 --max-time 60 "$INSTALL_URL" -o "$TMP" 2>/dev/null; then
            ACTUAL=$(grep -m1 '您正在安装宝塔面板' "$TMP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            rm -f "$TMP"
          else
            rm -f "$TMP"
          fi

          CHANGED=false
          if [ -z "$ACTUAL" ]; then
            echo "probe=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::无法探测上游版本（${INSTALL_URL}），按 dockerfile/12.0.0/VERSION(${VER}) 继续；若上游已更新，健康检查的版本校验会拦住"
          else
            echo "probe=ok" >> "$GITHUB_OUTPUT"
            if [ "$ACTUAL" != "$VER" ]; then
              # 语义比较：只自动升版。横幅低于 VERSION（官方回滚或提取异常）时
              # 绝不自动降级 —— dockerfile/12.0.0/VERSION 此时就是比对基准
              LATEST=$(printf '%s\n%s\n' "$VER" "$ACTUAL" | sort -V | tail -1)
              if [ "$LATEST" = "$ACTUAL" ]; then
                echo "::warning::发现上游新版本：${VER} → ${ACTUAL}，将按新版本构建发布"
                VER=$ACTUAL
                CHANGED=true
              else
                echo "::warning::上游横幅版本(${ACTUAL}) 低于 dockerfile/12.0.0/VERSION(${VER})，"
                echo "::warning::可能是官方回滚或提取异常，绝不自动降级，按 ${VER} 继续"
              fi
            fi
          fi

          # 🔧 强制更新：手动勾选后跳过「已是最新」判断，无条件进入构建发布。
          # 版本仍以探测结果为准（探测失败则用 VERSION 当前值）——
          # 强制的是「重建发布」这个动作，不是编造版本号
          if [ '${{ inputs.force_update }}' = 'true' ]; then
            CHANGED=true
            echo "🔧 强制更新模式：跳过版本比对，无条件构建发布（版本 ${VER}）"
          fi

          echo "value=${VER}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "宝塔版本：${VER}（changed=${CHANGED}）"

      - name: 📋 输出摘要
        run: |
          CURRENT="${{ steps.resolve.outputs.current }}"
          VALUE="${{ steps.resolve.outputs.value }}"
          PROBE="${{ steps.resolve.outputs.probe }}"
          CHANGED="${{ steps.resolve.outputs.changed }}"
          FORCE='${{ inputs.force_update }}'

          if [ "${FORCE}" = 'true' ]; then
            # 强制更新：探测到什么用什么，探测失败用 VERSION 当前值
            TEXT="🔧 强制更新：跳过版本比对，按 ${VALUE} 重建发布"
          else
            # 只有探测到新版本才进入构建，与触发方式无关（手动 = 手动跑一次探测）。
            # 探测失败同样阻断：无法确认上游状态时按旧版本继续构建，
            # 打出的镜像可能与上游不一致，宁可不发，等下次运行自动重试
            case "${PROBE}:${CHANGED}" in
              ok:true)  TEXT="🎉 发现上游新版本：${CURRENT} → ${VALUE}，将按新版本发布" ;;
              ok:false) TEXT="✅ 已是最新（${VALUE}），本次不构建" ;;
              failed:*) TEXT="⚠️ 探测失败，无法确认上游状态，本次不构建；稍后可手动重跑" ;;
              *)        TEXT="❓ 未知状态，本次不构建" ;;
            esac
          fi
          {
            echo "### 🔍 12.0.0 版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| dockerfile/12.0.0/VERSION | \`${CURRENT}\` |"
            echo "| 上游横幅版本 | \`${VALUE}\` |"
            echo "| 强制更新 | ${FORCE} |"
            echo "| 结果 | ${TEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 🧹 静态检查：shellcheck + 语法 + YAML
  #
  # 本地 `make lint` 在没装 shellcheck 时会「跳过」，等于这道检查长期没人真正跑过。
  # 放到 CI 里先装工具再跑，脚本质量才有持续保障。
  #
  # 与版本探测无关，所以**无条件运行**：即使本次不发布镜像，
  # 代码问题也能在当天被发现，而不是等到下次发布才暴露
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 🏗️ 以下 lint / build / publish / writeback 四个 job 已抽到
  # .github/workflows/reusable-build-push.yml —— 它们与「版本从哪来」无关，
  # 两个通道逐字相同，改构建流程只需改那一处。
  # 本文件只保留真正的通道差异：版本探测（安装脚本横幅）+ 参数装配。
  # ---------------------------------------------------------------------------
  release:
    name: 🏗️ 构建并发布（12.0.0 通道）
    needs: version
    uses: ./.github/workflows/reusable-build-push.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      channel: "12.0.0"
      version: ${{ needs.version.outputs.value }}
      changed: ${{ needs.version.outputs.changed }}
      version_file: dockerfile/12.0.0/VERSION
      dockerfile: ./dockerfile/12.0.0/Dockerfile
      cache_scope: "12.0.0"
      publish_latest: false
