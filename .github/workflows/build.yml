name: 📦 发布：构建并发布镜像

# ==============================================================================
#  📦 各条线共用这一份流水线（当前：12_version / 13_version）
#
#  线的差异只有一处来源：image/lines.conf。本文件里**不写**任何「if 是 13 就…」
#  式的判断 —— 唯一分支是「读表里的 probe 字段」；新增一条线 = 往表里加一行。
#
#  流程（每条线独立、互不阻塞）：
#    prep        读声明表 → 探测上游版本 → 与 VERSION 比对 → 生成「线 × 架构」矩阵
#    lint        静态检查（与版本无关，无条件运行）
#    build       各架构在原生 runner 构建 → 四套发布前检查 → 通过才按 digest 推送
#    publish     合并两架构 digest → 按标签策略打 repo:<版本>
#    write_back  把已发布版本号回写进该线的 VERSION 文件
#
#  🔑 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# ==============================================================================

on:
  # 发布是手动的：上游出问题时自动发布会把坏镜像分发给用户。
  # 常规节奏：先看 .github/workflows/drift.yml 的报告与 issue，确认无关键漂移后
  # 手动触发本工作流跑一次探测（探测到新版本才真正构建）。
  workflow_dispatch:
    inputs:
      line:
        # 用自由文本而不是 choice：线是会不断加的（14_version、15_version…），
        # choice 的选项得手写死，迟早要改 ✗
        description: '构建哪条线（线标识，如 12_version / 13_version；all=全部）'
        type: string
        default: 'all'
      force_update:
        description: '🔧 强制更新：跳过「已是最新」判断，直接重建发布'
        type: boolean
        default: false
      base_image:
        description: '可选：覆盖基础镜像（例如 debian:13），留空用 lines.conf 的值'
        type: string
        default: ''

# 不取消在途运行：末尾会回写 VERSION 文件，中途取消会让版本号写不回去
concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE_NAME: baota
  LINES: image/lines.conf
  VERSION_API: https://www.bt.cn/api/panel/get_version

jobs:
  # ---------------------------------------------------------------------------
  #  1) 读线声明表、探测上游版本、算出要构建的矩阵
  # ---------------------------------------------------------------------------
  prep:
    name: 🔍 读声明表并探测上游版本
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      any: ${{ steps.plan.outputs.any }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      pub_matrix: ${{ steps.plan.outputs.pub_matrix }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔍 解析线并生成计划
        id: plan
        env:
          SELECT: ${{ inputs.line }}
          FORCE: ${{ inputs.force_update }}
          BASE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail

          any=0
          build='[]'
          pub='[]'
          plan_rows=''

          while read -r line display vfile url probe tag base; do
            [ -n "${line:-}" ] || continue
            if [ "${SELECT}" != 'all' ] && [ "${SELECT}" != "${line}" ]; then
              continue
            fi

            [ -f "${vfile}" ] || { echo "::error::线 ${line} 的版本文件不存在：${vfile}"; exit 1; }
            cur=$(tr -d '[:space:]' < "${vfile}")
            printf '%s' "${cur}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::${vfile} 不是 x.y.z 形态：${cur}"; exit 1; }

            # 上游版本探测：方式由声明表的 probe 字段决定（banner / api）
            probe_out=''
            tmp=$(mktemp)
            case "${probe}" in
              banner)
                if curl -fsSL --connect-timeout 10 --max-time 60 "${url}" -o "${tmp}" 2> /dev/null; then
                  probe_out=$(grep -m1 '您正在安装宝塔面板' "${tmp}" \
                              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
                fi
                ;;
              api)
                if curl -fsSL --connect-timeout 10 --max-time 30 "${VERSION_API}" -o "${tmp}" 2> /dev/null; then
                  probe_out=$(tr -d '[:space:]' < "${tmp}" || true)
                fi
                ;;
              *)
                echo "::error::线 ${line} 的 probe 字段非法：${probe}（应为 banner 或 api）"
                exit 1
                ;;
            esac
            rm -f "${tmp}"

            target="${cur}"
            changed=false
            if [ -z "${probe_out}" ]; then
              echo "::warning::${display} 探测上游版本失败，按 ${vfile}（${cur}）继续"
            elif [ "${probe_out}" = "${cur}" ]; then
              echo "✅ ${display} 已是最新（${cur}）"
            else
              newer=$(printf '%s\n%s\n' "${cur}" "${probe_out}" | sort -V | tail -1)
              if [ "${newer}" = "${probe_out}" ]; then
                target="${probe_out}"
                changed=true
                echo "::warning::${display} 发现上游新版本：${cur} → ${probe_out}"
              else
                # 上游回滚或探测异常：绝不自动降级，VERSION 文件是比对基准
                echo "::warning::${display} 上游版本（${probe_out}）低于已发布版本（${cur}），不自动降级"
              fi
            fi
            if [ "${FORCE}" = 'true' ]; then
              changed=true
            fi

            base_img="${base}"
            if [ -n "${BASE_OVERRIDE}" ]; then
              base_img="${BASE_OVERRIDE}"
            fi
            case "${tag}" in
              exact | latest) ;;
              *) echo "::error::线 ${line} 的 tag 字段非法：${tag}（应为 exact 或 latest）"; exit 1 ;;
            esac

            # 回写：只有「本次要发布的版本 ≠ 仓库记录」时才需要
            if [ "${target}" = "${cur}" ]; then
              write_back='无需（就是当前记录）'
            else
              write_back="将回写 ${cur} → ${target}"
            fi

            if [ "${changed}" = 'true' ]; then
              any=1
              for arch in amd64 arm64; do
                runner='ubuntu-latest'
                if [ "${arch}" = 'arm64' ]; then
                  runner='ubuntu-24.04-arm'
                fi
                build=$(jq -c \
                  --arg line "${line}" --arg display "${display}" --arg version "${target}" \
                  --arg url "${url}" --arg base "${base_img}" \
                  --arg arch "${arch}" --arg runner "${runner}" \
                  '. + [{line:$line, display:$display, version:$version, url:$url, base:$base, arch:$arch, runner:$runner}]' \
                  <<< "${build}")
              done
              pub=$(jq -c \
                --arg line "${line}" --arg display "${display}" --arg version "${target}" --arg tag "${tag}" \
                '. + [{line:$line, display:$display, version:$version, tag:$tag}]' <<< "${pub}")
            fi

            plan_rows="${plan_rows}| ${line} | ${display} | ${cur} | ${target} | ${changed} | ${write_back} |"$'\n'
            {
              echo "v_${line}=${target}"
              echo "changed_${line}=${changed}"
            } >> "$GITHUB_OUTPUT"
          done < <(grep -vE '^[[:space:]]*(#|$)' "${LINES}")

          if [ "${any}" = '0' ]; then
            echo '各条线均已是最新（或探测失败），本次不构建；仍会跑静态检查'
          fi
          {
            echo "any=${any}"
            echo "build_matrix=$(jq -c . <<< "${build}")"
            echo "pub_matrix=$(jq -c . <<< "${pub}")"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### 🔍 线计划'
            echo
            echo '| 线 | 线 | 仓库记录 | 本次目标 | 需构建 | 回写 |'
            echo '|---|---|---|---|---|---|'
            printf '%s' "${plan_rows}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  #  2) 静态检查：与版本探测无关，无条件运行（没有新版本时也能发现问题）
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔧 安装检查工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml jq
          shellcheck --version
          python3 -c "import yaml; print('PyYAML ok')"

      - name: 🧹 运行静态检查
        run: make lint

  # ---------------------------------------------------------------------------
  #  3) 构建（线 × 架构，各自在原生 runner 上跑）
  #     每个 job 都是：本地构建 → 四套发布前检查 → 通过后才按 digest 推送
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ ${{ matrix.display }} / linux-${{ matrix.arch }}
    needs: [prep, lint]
    if: needs.prep.outputs.any == '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      # 不要 fail-fast：让所有线/架构都跑完，一次就能看到各自的问题
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.build_matrix) }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🖥️ 确认 runner 原生架构
        run: |
          echo "runner: $(uname -m)  target: ${{ matrix.arch }}"
          case "${{ matrix.arch }}-$(uname -m)" in
            amd64-x86_64|arm64-aarch64) echo '✅ 原生构建' ;;
            *) echo '::error::runner 与目标架构不匹配'; exit 1 ;;
          esac

      - name: 🔧 准备 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # ---- 第一次构建：只加载到本地，供四套健康检查使用 ----
      - name: 🏗️ 构建镜像（加载到本地，供健康检查）
        run: |
          echo "构建 baota:candidate（${{ matrix.display }} / linux/${{ matrix.arch }}）"
          docker buildx build \
            --file ./image/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --build-arg "BASE_IMAGE=${{ matrix.base }}" \
            --build-arg "INSTALL_URL=${{ matrix.url }}" \
            --build-arg "LINE=${{ matrix.line }}" \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ matrix.version }}" \
            --build-arg "IMAGE_DESCRIPTION=宝塔 Linux 面板容器化（${{ matrix.display }} 线 ${{ matrix.version }}）" \
            --tag "baota:candidate" \
            --cache-from "type=gha,scope=${{ matrix.line }}-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=${{ matrix.line }}-${{ matrix.arch }},mode=max" \
            .
          docker image inspect --format '本地镜像 ID：{{.Id}}' baota:candidate

      - name: 💽 runner 磁盘水位（healthcheck 判据②的对照）
        run: |
          echo '判据②：持久化根可用 <1GB 或已用 ≥95% 即 unhealthy'
          df -Ph / /var/lib/docker 2>/dev/null || true
          docker system df 2>/dev/null || true

      # ---- 四道验证：任一失败，本 job 即失败，推送不会发生 ----
      # 四套检查测四个互不相关的失效面（功能完整性 / 挂载与降级 / 版本演进 / 备份可恢复），
      # 各自启停独立容器（容器名按 PID 区分），可以并行跑
      - name: 🩺 四套健康检查并行（功能 / 挂载 / 升级 / 恢复）
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP:-/tmp}/hc-logs"
          mkdir -p "${LOG_DIR}"
          VER="${{ matrix.version }}"

          bash .github/scripts/check/run.sh core    "baota:candidate" "${VER}" > "${LOG_DIR}/core.log"    2>&1 & PID_CORE=$!
          bash .github/scripts/check/run.sh degrade  "baota:candidate"                > "${LOG_DIR}/degrade.log"  2>&1 & PID_DEGRADE=$!
          bash .github/scripts/check/run.sh upgrade "baota:candidate" "${VER}" > "${LOG_DIR}/upgrade.log" 2>&1 & PID_UPGRADE=$!
          bash .github/scripts/check/run.sh restore "baota:candidate"          > "${LOG_DIR}/restore.log" 2>&1 & PID_RESTORE=$!

          FAILED=0
          wait "${PID_CORE}"    || { echo "::error::core 检查失败，日志见 ${LOG_DIR}/core.log";    FAILED=1; }
          wait "${PID_DEGRADE}"  || { echo "::error::degrade 检查失败，日志见 ${LOG_DIR}/degrade.log";  FAILED=1; }
          wait "${PID_UPGRADE}" || { echo "::error::upgrade 检查失败，日志见 ${LOG_DIR}/upgrade.log"; FAILED=1; }
          wait "${PID_RESTORE}" || { echo "::error::restore 检查失败，日志见 ${LOG_DIR}/restore.log"; FAILED=1; }

          if [ "${FAILED}" -ne 0 ]; then
            for f in core degrade upgrade restore; do
              echo "===== ${f}.log (tail 80) ====="
              tail -n 80 "${LOG_DIR}/${f}.log" || true
            done
            exit 1
          fi
          echo '✅ 四套健康检查全过'

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 第二次构建：按 digest 推送，不产生任何 arch 标签 ----
      # 先构建并 load 到本机、四套检查通过后才推送；第二次命中刚写入的 GHA 缓存
      - name: 📤 按 digest 推送（不产生标签）
        id: push
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "推送 ${{ matrix.display }} / linux/${{ matrix.arch }}（按 digest，无标签）"

          docker buildx build \
            --file ./image/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --build-arg "BASE_IMAGE=${{ matrix.base }}" \
            --build-arg "INSTALL_URL=${{ matrix.url }}" \
            --build-arg "LINE=${{ matrix.line }}" \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ matrix.version }}" \
            --output "type=image,name=${REPO},push=true,push-by-digest=true" \
            --metadata-file "/tmp/meta-${{ matrix.arch }}.json" \
            --cache-from "type=gha,scope=${{ matrix.line }}-${{ matrix.arch }}" \
            .
          DIGEST=$(jq -r '."containerimage.digest"' "/tmp/meta-${{ matrix.arch }}.json")
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::取 digest 失败：${DIGEST}"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          printf '%s\n' "${DIGEST}" > "/tmp/digests/${{ matrix.arch }}"
          echo "✅ ${{ matrix.arch }} digest: ${DIGEST}"

      - name: 📦 上传 digest 产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.line }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  #  4) 合并两架构 digest → 按标签策略发布
  #     exact  只发 repo:<版本>（稳定线：避免「我到底跑的是哪个版本」变得不确定）
  #     latest 发 repo:<版本> + repo:latest
  # ---------------------------------------------------------------------------
  publish:
    name: 🚀 发布 ${{ matrix.display }}
    needs: [prep, build]
    if: needs.prep.outputs.any == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.pub_matrix) }}
    steps:
      - name: 📥 下载 digest 产物
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-${{ matrix.line }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 合并多架构 manifest 并打标签
        run: |
          set -euo pipefail
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          VER="${{ matrix.version }}"
          AMD64=$(tr -d '[:space:]' < /tmp/digests/amd64)
          ARM64=$(tr -d '[:space:]' < /tmp/digests/arm64)
          echo "amd64: ${AMD64}  arm64: ${ARM64}"
          [ -n "${AMD64}" ] && [ -n "${ARM64}" ] || { echo '::error::缺少 digest'; exit 1; }

          tags=( -t "${REPO}:${VER}" )
          if [ "${{ matrix.tag }}" = 'latest' ]; then
            tags+=( -t "${REPO}:latest" )
          fi
          docker buildx imagetools create "${tags[@]}" "${REPO}@${AMD64}" "${REPO}@${ARM64}"
          echo "✅ 已发布：${tags[*]}"

  # ---------------------------------------------------------------------------
  #  5) 回写该线的 VERSION 文件（保证文件永远对应「已推送」的版本）
  #     ★ max-parallel: 1：多条线同时 push main 会互相 non-fast-forward
  # ---------------------------------------------------------------------------
  write_back:
    name: ✏️ 回写 ${{ matrix.display }} 版本
    needs: [prep, publish]
    if: needs.prep.outputs.any == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.pub_matrix) }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: ✏️ 回写已发布的版本号
        id: wb
        run: |
          set -euo pipefail
          VER="${{ matrix.version }}"
          # 版本文件路径的真源是 lines.conf（不在这里写死 line → 路径的映射）
          VERSION_FILE=$(grep -E "^[[:space:]]*${{ matrix.line }}[[:space:]]" image/lines.conf \
                    | awk '{print $3}')
          [ -n "${VERSION_FILE}" ] || { echo '::error::未能从 lines.conf 解析版本文件路径'; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            CURRENT=$(tr -d '[:space:]' < "${VERSION_FILE}" || true)
            if [ "${CURRENT}" = "${VER}" ]; then
              # 正常情况：本次发布的版本与仓库记录一致（重建同一版本 / 并发回写已生效）
              echo "✅ ${VERSION_FILE} 已是 ${VER}，本次无需回写"
              echo 'result=skip' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            printf '%s\n' "${VER}" > "${VERSION_FILE}"
            git add "${VERSION_FILE}"
            git commit -m "chore(release): baota ${VER}（回写 ${VERSION_FILE}）"
            if git push origin HEAD:main; then
              # 推送成功 ≠ 远端真是这个值：回读校验一次，避免「静默没生效」
              git fetch origin main
              REMOTE_VER=$(git show "origin/main:${VERSION_FILE}" 2> /dev/null | tr -d '[:space:]' || true)
              [ "${REMOTE_VER}" = "${VER}" ] \
                || { echo "::error::回写后远端 ${VERSION_FILE} = ${REMOTE_VER:-空}，期望 ${VER}"; exit 1; }
              echo "✅ 已回写 ${VERSION_FILE} = ${VER}（远端校验通过）"
              echo 'result=written' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::push 失败（第 ${attempt} 次），rebase 后重试"
            sleep 5
          done
          echo '::error::VERSION 回写失败（连续 3 次 push 被拒）'
          exit 1

      - name: 📋 输出摘要
        run: |
          {
            if [ '${{ steps.wb.outputs.result }}' = 'written' ]; then
              echo "### ✏️ ${{ matrix.display }}：已回写版本记录为 \`${{ matrix.version }}\`"
            else
              echo "### ✏️ ${{ matrix.display }}：版本记录已是 \`${{ matrix.version }}\`，无需回写"
            fi
            echo
            echo "- 镜像标签：\`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}\`$([ '${{ matrix.tag }}' = 'latest' ] && echo ' 与 `:latest`')"
            echo "- 架构：linux/amd64、linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
