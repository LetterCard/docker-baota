name: 📦 正式版：构建并发布镜像

# ==============================================================================
#  📦 release 通道：每日自动跟进宝塔「正式版」并发布镜像
#
#  与 stable 通道的区别：
#    - 安装脚本用引导式的 install_panel.sh（自身不含版本号，装出的版本由
#      官方服务端决定），而 stable 用带版本横幅的 installStable_12.sh
#    - 版本号只取自官方 get_version API，与 release/VERSION 比对决定是否发布，
#      不再实装 install_panel.sh 去反查版本
#    - 发布 <版本> 与 latest 两个标签（stable 只发精确版本标签）
#
#  流程（每天自动跑一次，也可手动触发）：
#    🧹 lint        静态检查（shellcheck + 语法 + YAML），无条件运行，
#                   与是否有新版本无关
#    🔍 detect      get_version API 取最新版号，与 release/VERSION 比对；
#                   一致 → 结束；不一致 → 进入构建
#    🏗️ build       双架构：构建两次 —— 第一次本地构建+三套健康检查
#                   （19 项功能检查 / 挂载与降级场景 / 升级与降级路径），
#                   通过后第二次按 digest 推送（不创建 arch 标签）
#    🚀 publish     合并 digest → 打 repo:<版本> 与 repo:latest
#    ✏️ writeback   把「实际推送的版本号」回写 release/VERSION，供下次比对
#
#  关键保证：
#    - release/VERSION 永远对应「已成功推送」的版本（回写在发布之后）
#    - 构建失败时 VERSION 不动，下次运行会自动重试同一版本
#    - 回写推送失败仅告警：下次 detect 仍会发现不一致并自愈
#    - 官方安装脚本若被改坏，构建阶段（安装宝塔 + 19 项健康检查）会失败中断，
#      latest 不会指向坏镜像
#
#  🔑 所需仓库 Secrets：
#    DOCKERHUB_USERNAME  DockerHub 用户名
#    DOCKERHUB_TOKEN     DockerHub Access Token（不要用登录密码）
#  writeback 推送 main 需要 Workflow permissions 勾选 Read and write permissions。
# ==============================================================================

on:
  schedule:
    # 每天 UTC 17:00（北京时间 1 点），错开 stable 通道的检查时间
    - cron: '0 17 * * *'
  workflow_dispatch: {}

# 同一时刻只跑一个：排队期间上游版本若已被上一次运行发布，
# 重新探测会得到「已一致」，后续 job 自动跳过
concurrency:
  group: release-build-push
  cancel-in-progress: false

env:
  VERSION_FILE: release/VERSION
  # 安装脚本地址不再在这里定义：release 通道没有 workflow_dispatch 输入可覆盖它，
  # 写死会与 release/Dockerfile 的 ARG 默认值重复。由 Dockerfile 默认值提供即可。
  VERSION_API: https://www.bt.cn/api/panel/get_version
  IMAGE_NAME: baota

jobs:
  # ---------------------------------------------------------------------------
  # 🔍 版本号比对：get_version API vs release/VERSION。
  # 一致 → 今天无事可做；不一致 → 输出新版本号，交给 build 构建发布。
  # ---------------------------------------------------------------------------
  detect:
    name: 🔍 探测版本（release 通道）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔍 探测上游版本并与 VERSION 比对
        id: detect
        run: |
          UPSTREAM=$(curl -fsSL --connect-timeout 10 --max-time 30 "$VERSION_API" | tr -d '[:space:]' || true)
          if [ -z "$UPSTREAM" ]; then
            echo "::error::get_version API 无返回：${VERSION_API}"
            exit 1
          fi
          if ! printf '%s' "$UPSTREAM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::API 返回 '$UPSTREAM' 不是 x.y.z 格式"
            exit 1
          fi

          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE" || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::$VERSION_FILE 为空"
            exit 1
          fi

          if [ "$UPSTREAM" = "$CURRENT" ]; then
            RESULT=up-to-date
          else
            LATEST=$(printf '%s\n%s\n' "$CURRENT" "$UPSTREAM" | sort -V | tail -1)
            if [ "$LATEST" = "$UPSTREAM" ]; then
              RESULT=new-version
            else
              # API 版本低于仓库：官方回滚或 API 异常，绝不自动降级
              RESULT=behind
            fi
          fi

          if [ "$RESULT" = "new-version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "发现新版本：${CURRENT} → ${UPSTREAM}，进入构建发布"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "仓库版本 ${CURRENT}，API 版本 ${UPSTREAM}（${RESULT}），无需发布"
          fi
          echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"

      - name: 📋 输出摘要
        if: always()
        run: |
          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE" 2>/dev/null || echo 未知)
          if [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
            TEXT="🎉 发现新版本：${CURRENT} → ${{ steps.detect.outputs.version }}"
          elif [ -n "${{ steps.detect.outputs.changed }}" ]; then
            TEXT="✅ 已一致（${CURRENT}），无需发布"
          else
            TEXT="❌ 探测失败，详见日志"
          fi
          {
            echo "### 📦 release 通道检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| release/VERSION | \`${CURRENT}\` |"
            echo "| get_version API | \`${{ steps.detect.outputs.version || '获取失败' }}\` |"
            echo "| 结果 | ${TEXT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 🧹 静态检查：shellcheck + 语法 + YAML
  #
  # 本地 `make lint` 在没装 shellcheck 时会「跳过」，等于这道检查长期没人真正跑过。
  # 放到 CI 里先装工具再跑，脚本质量才有持续保障。
  #
  # 与版本探测无关，所以**无条件运行**：即使今天没有新版本、不发布镜像，
  # 代码问题也能当天被发现，而不是拖到下次发布才暴露
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 静态检查（shellcheck + 语法 + YAML）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🔧 安装检查工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version
          python3 -c "import yaml; print('PyYAML ok')"

      - name: 🧹 运行静态检查
        run: make lint

  # ---------------------------------------------------------------------------
  # 🏗️ 双架构构建。上下文是仓库根（两个通道共用 shared/build/ 下的构建脚本）。
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ 构建 linux/${{ matrix.arch }}
    needs: [detect, lint]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🖥️ 确认 runner 原生架构
        run: |
          echo "runner: $(uname -m)  target: ${{ matrix.arch }}"
          case "${{ matrix.arch }}-$(uname -m)" in
            amd64-x86_64|arm64-aarch64) echo "✅ 原生构建" ;;
            *) echo "::error::runner 与目标架构不匹配"; exit 1 ;;
          esac

      - name: 🔧 准备 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # ---- 第一次构建：只加载到本地，供三套健康检查使用 ----
      # 同时把构建缓存写进 GHA 缓存（按架构分 scope），第二次按 digest 推送会命中
      - name: 🏗️ 构建镜像（加载到本地，供健康检查）
        run: |
          echo "构建 baota:candidate（linux/${{ matrix.arch }}）"
          docker buildx build \
            --file ./release/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.detect.outputs.version }}" \
            --tag "baota:candidate" \
            --cache-from "type=gha,scope=release-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=release-${{ matrix.arch }},mode=max" \
            .
          docker image inspect --format '本地镜像 ID：{{.Id}}' baota:candidate

      # ---- 三道验证：任一失败，本 job 即失败，推送不会发生 ----
      - name: 🩺 验证 1/3：功能完整性
        run: |
          bash .github/scripts/health-check/run.sh core \
            "baota:candidate" "${{ needs.detect.outputs.version }}"
      # 上面 19 项只覆盖了「命名卷 + 单挂 /data」一种挂载方式。
      # 这里补两类同样致命、但那边测不到的场景：
      #   混合挂载（./data:/data + ./system:/data/system）能否正常工作
      #   持久化根被挂成只读时，是否真的被识别为降级而不是「写入静默丢失」
      - name: 🧪 验证 2/3：挂载方式与降级场景
        run: bash .github/scripts/health-check/run.sh mounts "baota:candidate"

      # 版本护栏、升级前快照、面板启动器刷新这三段**只在镜像版本变化时执行**，
      # 全新卷永远走不到 —— 上面两套检查都覆盖不到。
      # 这里通过改写持久化层里的版本记录，把「升级」与「降级」两条分支都跑一遍，
      # 确认快照真的生成（且内容完整）、启动器真的被刷新、降级不会阻断启动
      - name: 🔼 验证 3/3：升级与降级路径
        run: |
          bash .github/scripts/health-check/run.sh upgrade \
            "baota:candidate" "${{ needs.detect.outputs.version }}"

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 第二次构建：按 digest 推送，不产生任何 arch 标签 ----
      #
      # 为什么构建两次（取舍，不是技术限制）：buildx 一次调用里没法「测完再推」。
      # 第一次构建 load 到本机、三套健康检查通过后，这里第二次推送；第二次命中
      # 第一次刚写入的 GHA 缓存，几乎不再重新编译。
      # push-by-digest=true：只把镜像按 digest 存进 registry，不创建任何标签 ——
      # DockerHub 上永远不会出现 <版本>-amd64 / <版本>-arm64。
      - name: 📤 按 digest 推送（不产生标签）
        id: push
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "推送 linux/${{ matrix.arch }}（按 digest，无标签）"
          docker buildx build \
            --file ./release/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "IMAGE_VERSION=${{ needs.detect.outputs.version }}" \
            --output "type=image,name=${REPO},push=true,push-by-digest=true" \
            --metadata-file "/tmp/meta-${{ matrix.arch }}.json" \
            --cache-from "type=gha,scope=release-${{ matrix.arch }}" \
            .
          DIGEST=$(jq -r '."containerimage.digest"' "/tmp/meta-${{ matrix.arch }}.json")
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::取 digest 失败：${DIGEST}"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          printf '%s\n' "${DIGEST}" > "/tmp/digests/${{ matrix.arch }}"
          {
            echo "### 🏗️ linux/${{ matrix.arch }}"
            echo ""
            echo "- 按 digest 推送：\`${REPO}@${DIGEST}\`（无 arch 标签）"
            echo "- 字节与健康检查对象同源（复用同一份 GHA 缓存）"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ ${{ matrix.arch }} digest: ${DIGEST}"

      - name: 📦 上传 digest 产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-release-${{ matrix.arch }}
          path: "/tmp/digests/${{ matrix.arch }}"
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 🚀 合并 digest → repo:<版本> 与 repo:latest 两个标签。
  # 依赖 build 两个矩阵 job 全部成功，任一架构失败都到不了这里，
  # 所以 latest 永远不会指向坏镜像。
  # ---------------------------------------------------------------------------
  publish:
    name: 🚀 合并多架构并发布（<版本> + latest）
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.publish.outputs.repo }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: 📥 下载 digest 产物
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-release-*
          path: /tmp/digests
          merge-multiple: true

      - name: 🔑 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 合并多架构 manifest
        id: publish
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          VER="${{ needs.detect.outputs.version }}"

          AMD64=$(tr -d '[:space:]' < /tmp/digests/amd64)
          ARM64=$(tr -d '[:space:]' < /tmp/digests/arm64)
          echo "amd64: ${AMD64}  arm64: ${ARM64}"
          [ -n "$AMD64" ] && [ -n "$ARM64" ] || { echo "::error::缺少 digest"; exit 1; }

          # 约定：release 是正式版通道，同时打版本号与 latest 两个标签，
          # 让用户 docker pull 不指定版本时无脑拉到最新正式版
          docker buildx imagetools create \
            -t "${REPO}:${VER}" -t "${REPO}:latest" \
            "${REPO}@${AMD64}" "${REPO}@${ARM64}"

          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: 📋 输出摘要
        run: |
          REPO="${{ steps.publish.outputs.repo }}"
          TAG="${{ steps.publish.outputs.tag }}"
          {
            echo "### 🚀 release 通道发布完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 宝塔版本 | \`${TAG}\` |"
            echo "| 标签 | \`${REPO}:${TAG}\` 与 \`${REPO}:latest\` |"
            echo "| 架构 | linux/amd64、linux/arm64 |"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${REPO}:latest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ✏️ 发布成功之后才回写 release/VERSION —— 保证文件永远对应「已推送」
  # 的版本。构建失败时 VERSION 不动，下次运行会自动重试同一版本；
  # 回写推送失败仅告警：下次 detect 仍会发现不一致并自愈。
  # ---------------------------------------------------------------------------
  writeback:
    name: ✏️ 回写 release/VERSION
    needs: [detect, publish]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: ✏️ 回写已发布的版本号
        run: |
          VER="${{ needs.publish.outputs.tag }}"
          printf '%s\n' "$VER" > "$VERSION_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "chore: release baota ${VER} (writeback release/VERSION)"
          if git push; then
            echo "已回写 $VERSION_FILE = ${VER}"
          else
            echo "::warning::回写推送失败（分支可能受保护）。镜像 ${VER} 已发布成功；下次运行 detect 仍会发现不一致并自动重试回写"
          fi

      - name: 📋 输出摘要
        run: |
          echo "### ✏️ release/VERSION 已回写为 \`${{ needs.publish.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
