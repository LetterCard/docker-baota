name: 🔭 官方源：变更与漂移检测

# ==============================================================================
#  本工作流只做「看」，绝不发布任何镜像。
#
#  目的是在宝塔上游更新后，第一时间发现会破坏持久化的变更：
#    目录漂移：安装产生的文件落到已知 overlay 持久化目录集合之外
#      → 那部分数据不会被持久化，属于静默丢数据
#
#  刻意不检测「面板升级入口 / 代码级更新路径」：那要求逐项跟踪上游脚本名与
#  代码内的执行路径，与上游内部实现强耦合、永远跟不完，且并不影响数据安全
#
#  两级节奏（控制成本）：
#    · probe  每天跑：只取版本号与安装脚本 sha256，与基线比对，几十秒完成
#    · drift   仅在上游有变更（或手动强制）时跑：真的装一遍并做文件系统比对
#
#  发布已改为手动（12.0.0 / 13.0.0 均移除了 schedule），
#  维护流程：看本工作流的报告与 issue → 确认无关键漂移 → 手动触发对应发布工作流。
#
#  🔑 所需权限：仓库 Settings → Actions → Workflow permissions 需勾
#     Read and write permissions（回写基线与报告、开 issue）。
# ==============================================================================

on:
  schedule:
    # 每天 UTC 01:00（北京时间 9 点）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_drift:
        description: '强制跑重量级安装对比（默认仅在上游有变更时执行）'
        type: boolean
        default: false

permissions:
  contents: write   # 回写 drift/baseline.json / .github/reports/drift.md
  issues: write     # 检测到关键漂移时开 issue 提醒

concurrency:
  group: drift
  cancel-in-progress: false

env:
  BASELINE: .github/scripts/drift/baseline.json
  REPORT: .github/reports/drift.md
  # 与构建所用的基础镜像保持一致（Dockerfile 的 ARG BASE_IMAGE 默认值）。
  # 若改用 debian:13 构建，此处必须同步 —— 漂移检测要以同一个基座为基准
  BASE_IMAGE: debian:12
  VERSION_API: https://www.bt.cn/api/panel/get_version
  LABEL: BUG

jobs:
  # ---------------------------------------------------------------------------
  #  1) 每天跑：轻量探测
  # ---------------------------------------------------------------------------
  probe:
    name: 🔍 探测上游版本与安装脚本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      reason: ${{ steps.cmp.outputs.reason }}
      v12_version: ${{ steps.fetch.outputs.v12_version }}
      v13_version: ${{ steps.fetch.outputs.v13_version }}
      v12_url: ${{ steps.fetch.outputs.v12_url }}
      v13_url: ${{ steps.fetch.outputs.v13_url }}
      v12_sha: ${{ steps.fetch.outputs.v12_sha }}
      v13_sha: ${{ steps.fetch.outputs.v13_sha }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 📡 拉取官方版本与两个通道的安装脚本
        id: fetch
        run: |
          set -euo pipefail

          S_URL=$(sed -n 's/^ARG INSTALL_URL=//p' dockerfile/12.0.0/Dockerfile  | head -1 | tr -d '\r')
          R_URL=$(sed -n 's/^ARG INSTALL_URL=//p' dockerfile/13.0.0/Dockerfile | head -1 | tr -d '\r')
          [ -n "$S_URL" ] || { echo "::error::未能从 dockerfile/12.0.0/Dockerfile 解析 INSTALL_URL";  exit 1; }
          [ -n "$R_URL" ] || { echo "::error::未能从 dockerfile/13.0.0/Dockerfile 解析 INSTALL_URL"; exit 1; }

          # 从安装脚本横幅提取版本（与 12.0.0-build-push 的探测逻辑一致）
          curl -fsSL --connect-timeout 10 --max-time 60 "$S_URL" -o /tmp/install_v12.sh
          S_SHA=$(sha256sum /tmp/install_v12.sh | awk '{print $1}')
          S_VER=$(grep -m1 '您正在安装宝塔面板' /tmp/install_v12.sh \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)

          curl -fsSL --connect-timeout 10 --max-time 60 "$R_URL" -o /tmp/install_v13.sh
          R_SHA=$(sha256sum /tmp/install_v13.sh | awk '{print $1}')

          # 13.0.0 通道版本来自官方接口（与 13.0.0-build-push 一致）
          R_VER=$(curl -fsSL --connect-timeout 10 --max-time 30 "$VERSION_API" | tr -d '[:space:]' || true)

          {
            echo "v12_url=$S_URL"
            echo "v13_url=$R_URL"
            echo "v12_sha=$S_SHA"
            echo "v13_sha=$R_SHA"
            echo "v12_version=${S_VER:-unknown}"
            echo "v13_version=${R_VER:-unknown}"
          } >> "$GITHUB_OUTPUT"

          echo "v12  脚本：$S_URL（版本 ${S_VER:-unknown}，sha ${S_SHA:0:12}…）"
          echo "v13 脚本：$R_URL（版本 ${R_VER:-unknown}，sha ${R_SHA:0:12}…）"

      - name: 🆚 与基线比对
        id: cmp
        run: |
          set -euo pipefail
          if [ ! -f "$BASELINE" ]; then
            echo 'changed=true'  >> "$GITHUB_OUTPUT"
            echo 'reason=首次运行，尚无基线' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REASONS=''
          B_S_SHA=$(jq -r '.v12_sha  // ""' "$BASELINE")
          B_R_SHA=$(jq -r '.v13_sha // ""' "$BASELINE")
          B_S_VER=$(jq -r '.v12_version  // ""' "$BASELINE")
          B_R_VER=$(jq -r '.v13_version // ""' "$BASELINE")

          if [ "${{ steps.fetch.outputs.v12_sha }}" != "$B_S_SHA" ]; then
            REASONS="${REASONS}v12 安装脚本已变更；"
          fi
          if [ "${{ steps.fetch.outputs.v13_sha }}" != "$B_R_SHA" ]; then
            REASONS="${REASONS}v13 安装脚本已变更；"
          fi
          SV='${{ steps.fetch.outputs.v12_version }}'
          RV='${{ steps.fetch.outputs.v13_version }}'
          if [ "$SV" != 'unknown' ] && [ "$SV" != "$B_S_VER" ]; then
            REASONS="${REASONS}12.0.0 版本 ${B_S_VER} → ${SV}；"
          fi
          if [ "$RV" != 'unknown' ] && [ "$RV" != "$B_R_VER" ]; then
            REASONS="${REASONS}13.0.0 版本 ${B_R_VER} → ${RV}；"
          fi

          if [ -n "$REASONS" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "reason=${REASONS}" >> "$GITHUB_OUTPUT"
            echo "检测到上游变更：${REASONS}"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'reason=与基线一致，本次不跑安装对比' >> "$GITHUB_OUTPUT"
            echo '与基线一致，跳过安装对比。'
          fi

  # ---------------------------------------------------------------------------
  #  2) 有变更时跑：真的装一遍并比对
  # ---------------------------------------------------------------------------
  drift:
    name: 🧪 安装对比（目录 / 升级入口）
    needs: probe
    if: >-
      needs.probe.outputs.changed == 'true' ||
      inputs.force_drift ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      critical: ${{ steps.merge.outputs.critical }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 🧪 逐通道安装并检测
        id: run
        run: |
          set -euo pipefail
          mkdir -p /tmp/uw
          : > /tmp/uw/critical

          for CH in v12 v13; do
            case "$CH" in
              v12)  URL='${{ needs.probe.outputs.v12_url }}' ;;
              v13) URL='${{ needs.probe.outputs.v13_url }}' ;;
            esac
            echo "▶️ 开始检测 ${CH} 通道：${URL}"
            CRIT=0
            INSTALL_URL="$URL" \
            BASE_IMAGE="$BASE_IMAGE" \
            OUT_MD="/tmp/uw/${CH}.md" \
            CRIT_FILE="/tmp/uw/${CH}.crit" \
              bash .github/scripts/drift/install.sh \
              || { echo "::error::${CH} 通道检测失败"; exit 1; }
            echo "$CH $(cat "/tmp/uw/${CH}.crit")" >> /tmp/uw/critical
          done

      - name: 📤 上传中间产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: drift-detail
          path: /tmp/uw/
          retention-days: 30

      - name: 🔀 汇总关键标记
        id: merge
        run: |
          set -euo pipefail
          if grep -q ' 1$' /tmp/uw/critical; then
            echo 'critical=1' >> "$GITHUB_OUTPUT"
            echo '::error::检测到关键漂移，详见报告'
          else
            echo 'critical=0' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  #  3) 写报告、更新基线、必要时开 issue 提醒
  # ---------------------------------------------------------------------------
  report:
    name: 📝 报告与提醒
    needs: [probe, drift]
    if: always() && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1

      - name: 📥 下载中间产物
        if: needs.drift.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: drift-detail
          path: /tmp/uw

      # rebase 必须在「生成 / 修改任何仓库文件」之前执行：此时 working tree 干净。
      # 否则 .github/reports/drift.md / baseline.json / README.md 已处于 modified，git rebase 会因 dirty tree 中止
      - name: 🔄 对齐远端
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      - name: 📝 生成报告并更新基线
        run: |
          set -euo pipefail
          {
            echo '# 🔭 漂移检测报告'
            echo
            echo "> 本文件由 \`.github/workflows/drift.yml\` 自动生成，每次运行整体覆盖。"
            echo
            echo "- 生成时间（UTC）：$(date -u '+%F %T')"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 12.0.0 版本：${{ needs.probe.outputs.v12_version }}"
            echo "- 13.0.0 版本：${{ needs.probe.outputs.v13_version }}"
            echo "- 变更判定：${{ needs.probe.outputs.reason }}"
            echo
            if [ "${{ needs.drift.result }}" = 'success' ]; then
              for CH in v12 v13; do
                if [ -f "/tmp/uw/${CH}.md" ]; then
                  echo "---"
                  echo
                  echo "## ${CH} 通道"
                  echo
                  cat "/tmp/uw/${CH}.md"
                  echo
                fi
              done
            else
              echo '---'
              echo
              echo '本次未执行安装对比（与基线一致，或被跳过）。'
              echo
            fi
          } > "$REPORT"

          # 基线仅在成功跑完分析后更新，避免把失败运行的中间值写进去
          if [ "${{ needs.drift.result }}" = 'success' ]; then
            jq -n \
              --arg ss '${{ needs.probe.outputs.v12_sha }}' \
              --arg rs '${{ needs.probe.outputs.v13_sha }}' \
              --arg sv '${{ needs.probe.outputs.v12_version }}' \
              --arg rv '${{ needs.probe.outputs.v13_version }}' \
              '{v12_sha:$ss, v13_sha:$rs, v12_version:$sv, v13_version:$rv}' > "$BASELINE"
            echo '基线已更新。'
          fi

      - name: ✏️ 注入 README（漂移检测报告章节）
        run: |
          set -euo pipefail
          # rebase 已在「🔄 对齐远端」步骤完成（working tree 干净时），这里只注入并提交
          python3 .github/scripts/report.py "${{ env.REPORT }}" DAILY-DRIFT-REPORT

      - name: 💾 回写报告、基线与 README
        run: |
          set -euo pipefail
          # 远端已在「🔄 对齐远端」步骤 rebase 对齐（当时 working tree 还是干净的），
          # 这里只提交本次生成的报告、基线与 README 内嵌区块
          git add "$REPORT" "$BASELINE" README.md
          if git diff --cached --quiet; then
            echo '报告与基线无变化，跳过提交。'
          else
            git commit -m 'chore(drift): 更新漂移检测报告与基线'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 🚨 关键漂移：开 issue 提醒并让本作业失败
        if: needs.drift.outputs.critical == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='[上游变更] 检测到关键漂移，需人工介入'
          NUM=$(gh issue list --label "$LABEL" --state open \
                --json number --jq '.[0].number' || true)
          {
            echo "## 检测时间（UTC）：$(date -u '+%F %T')"
            echo
            echo "- 12.0.0 版本：${{ needs.probe.outputs.v12_version }}"
            echo "- 13.0.0 版本：${{ needs.probe.outputs.v13_version }}"
            echo "- 变更判定：${{ needs.probe.outputs.reason }}"
            echo
            echo '完整报告见 `.github/reports/drift.md`（也已内嵌进 README「漂移检测报告」章节）。'
            echo '处理完毕后请关闭本 issue；未处理前本工作流会持续失败以作提醒。'
          } > /tmp/body.md

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file /tmp/body.md
            echo "已在既有 issue #${NUM} 追加记录"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file /tmp/body.md
            echo '已创建提醒 issue'
          fi

          echo '::error::检测到关键漂移，本次作业标记为失败以便通知维护者'
          exit 1
