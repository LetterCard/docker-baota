name: 🔭 官方源：变更与漂移检测

# ==============================================================================
#  只监测、不发布。目的：上游更新后第一时间发现会破坏持久化的变更 ——
#  「安装产生的文件落到了已知持久化位置之外」= 那部分数据不会被持久化。
#
#  刻意不检测「面板升级入口 / 代码路径」：那要逐项跟踪上游脚本名与执行路径，
#  永远跟不完，且不影响数据安全（面板内更新不生效现在由 image/scripts/guard.sh
#  在执行入口兜住）。
#
#  两级节奏（同一个 job 内串联，省掉产物搬运）：
#    ① 每天：逐线取安装脚本 sha256，与本仓库基线比对（几十秒）
#    ② 仅当有变更 / 手动强制：真装一遍做目录比对（几分钟），然后更新基线
#  基线只在②成功后更新 —— 否则一次失败就会把「上游变了」这个信号吞掉。
#
#  检测范围 = image/channels.conf 里的各条线：新增一条线不用改本文件。
# ==============================================================================

on:
  schedule:
    - cron: '0 1 * * *'        # 每天 UTC 01:00（北京时间 09:00）
  workflow_dispatch:
    inputs:
      force_drift:
        description: '强制跑重量级安装对比（默认仅在上游脚本变更时执行）'
        type: boolean
        default: false

permissions:
  contents: write   # 回写 baseline.json / .github/reports/drift.md / README
  issues: write     # 检测到关键漂移时开 issue 提醒

concurrency:
  group: drift
  cancel-in-progress: false

env:
  BASELINE: .github/scripts/drift/baseline.json
  REPORT: .github/reports/drift.md
  CHANNELS: image/channels.conf
  # 与构建所用基础镜像一致（image/channels.conf 的 base 字段）
  BASE_IMAGE: debian:12
  LABEL: BUG

jobs:
  drift:
    name: 🔭 探测上游变更并（必要时）做目录对比
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # rebase 必须在「生成 / 修改任何仓库文件」之前执行（否则 dirty tree 会中止 rebase）
      - name: 🔄 同步 main（rebase）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: 🔍 逐线探测安装脚本（sha256 与基线比对）
        id: probe
        run: |
          set -euo pipefail
          lines='[]'
          changed=false
          reason=''
          summary=''

          while read -r line channel vfile url _probe _tag _base; do
            [ -n "${line:-}" ] || continue
            recorded=$(tr -d '[:space:]' < "${vfile}" || true)

            tmp=$(mktemp)
            curl -fsSL --connect-timeout 10 --max-time 60 "${url}" -o "${tmp}" \
              || { echo "::error::拉取 ${line} 的安装脚本失败：${url}"; exit 1; }
            sha=$(sha256sum "${tmp}" | awk '{print $1}')
            rm -f "${tmp}"

            base_sha=''
            [ -f "${BASELINE}" ] && base_sha=$(jq -r --arg k "${line}" '.lines[$k] // ""' "${BASELINE}")
            if [ "${sha}" != "${base_sha}" ]; then
              changed=true
              reason="${reason}${channel} 安装脚本已变更；"
              state='已变更'
            else
              state='与基线一致'
            fi

            lines=$(jq -c --arg line "${line}" --arg channel "${channel}" \
              --arg url "${url}" --arg sha "${sha}" --arg ver "${recorded}" \
              '. + [{line:$line, channel:$channel, url:$url, sha:$sha, version:$ver, state:$state}]' \
              <<< "${lines}")
            summary="${summary}| ${channel} | \`${line}\` | ${recorded} | ${state} | \`${sha:0:12}\` |"$'\n'
            echo "${line}（${channel}）：${state}（sha ${sha:0:12}…）"
          done < <(grep -vE '^[[:space:]]*(#|$)' "${CHANNELS}")

          if [ "${changed}" = 'false' ]; then
            reason='与基线一致，本次不跑安装对比'
          fi
          {
            echo "changed=${changed}"
            echo "reason=${reason}"
            echo "lines=$(jq -c . <<< "${lines}")"
            echo "summary<<EOF"
            printf '%s' "${summary}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "变更判定：${reason}"

      - name: 🧪 安装对比（有变更 / 手动强制时）
        if: >-
          steps.probe.outputs.changed == 'true' ||
          inputs.force_drift ||
          github.event_name == 'workflow_dispatch'
        id: analyze
        env:
          LINES: ${{ steps.probe.outputs.lines }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/uw
          critical=0

          while IFS= read -r item; do
            line=$(jq -r '.line' <<< "${item}")
            channel=$(jq -r '.channel' <<< "${item}")
            url=$(jq -r '.url' <<< "${item}")
            echo "▶️ 检测 ${line}（${channel}）：${url}"
            INSTALL_URL="${url}" BASE_IMAGE="${BASE_IMAGE}" \
            OUT_MD="/tmp/uw/${line}.md" CRIT_FILE="/tmp/uw/${line}.crit" \
              bash .github/scripts/drift/install.sh \
              || { echo "::error::${line} 安装对比失败"; exit 1; }
            [ "$(cat "/tmp/uw/${line}.crit" 2> /dev/null || echo 0)" = '1' ] && critical=1
          done < <(jq -c '.[]' <<< "${LINES}")

          echo "critical=${critical}" >> "$GITHUB_OUTPUT"
          [ "${critical}" -eq 0 ] || echo '::error::检测到关键漂移（详见报告）'

      - name: 📝 生成报告（必要时更新基线）
        env:
          LINES: ${{ steps.probe.outputs.lines }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -euo pipefail
          analyzed='${{ steps.analyze.outcome }}'
          {
            echo '# 🔭 漂移检测报告'
            echo
            echo '> 本文件由 `.github/workflows/drift.yml` 自动生成，每次运行整体覆盖。'
            echo
            echo "- 生成时间（UTC）：$(date -u '+%F %T')"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 变更判定：${{ steps.probe.outputs.reason }}"
            echo
            echo '| 通道 | 线 | 仓库记录版本 | 安装脚本 | sha256 |'
            echo '|---|---|---|---|---|'
            printf '%s' "${SUMMARY}"
            echo
            if [ "${analyzed}" = 'success' ]; then
              while IFS= read -r item; do
                line=$(jq -r '.line' <<< "${item}")
                channel=$(jq -r '.channel' <<< "${item}")
                echo '---'
                echo
                echo "## ${channel}（\`${line}\`）"
                echo
                if [ -f "/tmp/uw/${line}.md" ]; then
                  cat "/tmp/uw/${line}.md"
                else
                  echo '_（未产出该线的对比结果）_'
                fi
                echo
              done < <(jq -c '.[]' <<< "${LINES}")
            else
              echo '---'
              echo
              echo '本次未执行安装对比（安装脚本与基线一致，或被跳过）。'
              echo
            fi
          } > "${REPORT}"

          # 基线只在对比真的跑完后更新：否则一次失败就会把「上游变了」的信号吞掉
          if [ "${analyzed}" = 'success' ]; then
            jq -n --argjson lines "${LINES}" \
              '{lines: ($lines | map({key: .line, value: .sha}) | from_entries)}' > "${BASELINE}"
            echo '基线已更新（只记安装脚本 sha256）'
          fi

      - name: ✏️ 注入 README 并回写仓库
        run: |
          set -euo pipefail
          python3 .github/scripts/report.py "${REPORT}" DAILY-DRIFT-REPORT
          git add "${REPORT}" "${BASELINE}" README.md
          if git diff --cached --quiet; then
            echo '报告与基线无变化，跳过提交。'
          else
            git commit -m 'chore(drift): 更新漂移检测报告与基线'
            git push origin HEAD:main
          fi

      - name: 🚨 关键漂移：开 issue 并让本次运行失败
        if: steps.analyze.outputs.critical == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -euo pipefail
          TITLE='[上游变更] 检测到关键漂移，需人工介入'
          NUM=$(gh issue list --label "$LABEL" --state open \
                --json number --jq '.[0].number' || true)
          {
            echo "## 检测时间（UTC）：$(date -u '+%F %T')"
            echo
            echo "- 变更判定：${{ steps.probe.outputs.reason }}"
            echo
            echo '| 通道 | 线 | 仓库记录版本 | 安装脚本 | sha256 |'
            echo '|---|---|---|---|---|'
            printf '%s' "${SUMMARY}"
            echo
            echo '完整报告见 `.github/reports/drift.md`（也已内嵌进 README「漂移检测报告」章节）。'
            echo '处理后请关闭本 issue；未处理前本工作流会持续失败以作提醒。'
          } > /tmp/body.md

          if [ -n "${NUM}" ]; then
            gh issue comment "${NUM}" --body-file /tmp/body.md
            echo "已在既有 issue #${NUM} 追加记录"
          else
            gh issue create --title "${TITLE}" --label "$LABEL" --body-file /tmp/body.md
            echo '已创建提醒 issue'
          fi

          echo '::error::检测到关键漂移，本次作业标记为失败以便通知维护者'
          exit 1
