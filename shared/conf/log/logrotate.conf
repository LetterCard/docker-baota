# 宝塔容器 · 面板与站点日志轮转
#
# 本文件只在 /etc/logrotate.d/baota-panel 不存在时生成；已存在则原样保留，
# 所以你可以直接改它，不会被镜像覆盖。想恢复默认：删掉该文件后重启容器。
#
# 为什么必须用 copytruncate：
#   面板（python）、nginx、php-fpm 都长期持有日志文件句柄。logrotate 默认的
#   轮转方式（rename 后让进程重开文件）对这些进程无效 —— 它们会继续往已被
#   rename 的旧文件里写，磁盘空间不释放、新日志还看不到，越积越多。
#   copytruncate 是「先复制一份、再把原文件原地截断」，进程无感知、句柄继续
#   有效。代价是复制与截断之间极短的窗口内可能丢几行，对本场景完全可接受。
#
# daily + maxsize 的含义：每天轮转一次；若当天体积已超过 maxsize 也立刻轮转。
# 注意 logrotate 由 systemd timer 每天触发一次，所以单日内的暴涨仍会撑到
# 下次检查。有更严需求的站点应另配 nginx 自身切割，或缩短 timer 周期。
#
# 为什么不用 delaycompress：它是为「rename 轮转」设计的 —— 那种方式下刚被
# rename 的归档可能仍被进程写入，推迟一轮压缩更安全。但这里是 copytruncate，
# 归档是完整副本、不可能再被写入，延迟压缩只会让轮转瞬间磁盘占用翻倍
# （实测：50M 日志轮转后立刻变成「原文件 + 50M 未压缩归档」），得不偿失。

# 面板日志（error.log / task.log 等）
/www/server/panel/logs/*.log {
    daily
    maxsize 50M
    rotate 7
    missingok
    notifempty
    compress
    copytruncate
    dateext
}

# 站点访问日志（nginx）—— 公开站点增长最快的一项
/www/wwwlogs/*.log {
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    copytruncate
    dateext
}

# MySQL 错误日志与慢查询日志
/www/server/data/*.err
/www/server/data/*slow*.log {
    weekly
    maxsize 100M
    rotate 4
    missingok
    notifempty
    compress
    copytruncate
    dateext
}
