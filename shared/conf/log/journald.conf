# 宝塔容器 · journald 日志体积上限
#
# ⚠️ 本文件由镜像维护，每次启动从 /baota/conf/log/ 重放 —— 直接改它会被覆盖。
#    需要自定义请另建 /etc/systemd/journald.conf.d/20-你的名字.conf，
#    systemd 按文件名排序加载，编号大的覆盖编号小的。
#
# 为什么必须显式设上限：
#   容器启动时会创建 /var/log/journal 让日志跨重启保留，而这个目录落在
#   持久化层（data/var/log/journal）里。systemd 的编译默认值是
#   「所在文件系统的 10%」—— data/ 若挂在几 TB 的存储池上，这个默认值
#   意味着日志可以吃掉几百 GB 才停手。对 NAS / 飞牛这类大盘场景，
#   是实打实的磁盘风险，而且日志增长是静默的，等到发现时盘已经满了。
[Journal]
# 显式声明持久化，不依赖「目录是否存在」这个隐式判定
Storage=persistent

# 日志总占用上限。与 SystemKeepFree 取更严格者生效
SystemMaxUse=200M

# 至少给其他用途留出的空闲空间，避免日志把盘写满
SystemKeepFree=512M

# 单个日志文件上限，便于按文件粒度回收
SystemMaxFileSize=32M

# 最长保留时间。排查问题 7 天足够，再久价值递减
MaxRetentionSec=7day
