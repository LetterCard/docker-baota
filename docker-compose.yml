# ==============================================================================
#  🐳 宝塔 Linux 面板（默认 12.x 稳定线；换线见 README「发布线」）
#     已按飞牛 NAS / fnOS 适配；非飞牛的 x86_64 Linux 可直接用本文件。
#  🐂 飞牛部署：Docker → 项目 → 新建项目 → 项目名 baota → 粘贴本文件
#            → 把 image 改成自己的镜像名 → 立即构建 → 日志拿首次登录信息
#  💾 数据默认存本文件同级 data/（飞牛项目落在存储池上直接用）；换盘改绝对路径，如 /vol2/baota/data
#  🔌 端口：fnOS 占用 80/443/22，此处挪到 8880/8443/2222
# ==============================================================================
name: baota

services:
  baota:
    # 默认稳定线 12.0.0；用 13.0.0（最新正式版）：BAOTA_IMAGE=bugseeker/baota:13.0.0 docker compose up -d
    image: ${BAOTA_IMAGE:-bugseeker/baota:12.0.0}
    container_name: baota
    hostname: baota
    restart: unless-stopped

    # ---- ⚙️ systemd + overlay 持久化的必要条件 ----
    # privileged：容器内需 mount overlay、跑 systemd、宝塔管服务与 iptables；
    #   等同把宿主机内核交给容器，仅在内网可信环境使用。
    # 不写 cgroup: host：fnOS(Debian12, cgroup v2) 下 Docker 默认私有 cgroup 命名空间，
    #   systemd 工作正常且不碰宿主机 cgroup 树；老 cgroup v1 宿主机 Docker 会自动退回 host。
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    # /run、/run/lock 必须 tmpfs：systemd 运行态不能落盘，否则重建读到过期 pid/socket 起不来。
    # /tmp 故意不挂 tmpfs：上传/解压大文件走内存会撑爆 NAS，留可写层随容器销毁。
    tmpfs:
      - /run
      - /run/lock

    # systemd 只在收到 SIGRTMIN+3 才正常关机（依次停 nginx/mysql/面板）；
    # 默认 SIGTERM 对 PID1 的 systemd 是「重新执行自己」，会超时被杀。
    stop_signal: SIGRTMIN+3
    stop_grace_period: 90s

    # /dev/shm 默认 64M，MySQL/Redis 会踩坑
    shm_size: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

    # ---- ⚙️ 资源上限 ----
    # 不设上限：MySQL/php-fpm 内存失控会拖垮整机其他服务。
    # 算法：宿主机内存 − 系统与其他服务占用 − 1G 余量（例：8G/飞牛占2G → 约 4g）。
    # 这是上限非预分配。⚠️ 宝塔看不到上限（free 仍显示宿主机内存），装完 MySQL
    # 须在面板「数据库→设置」把 buffer pool 压到本值 25%~50%，否则仍会撞上限被 OOM。
    mem_limit: 4g
    # cpus: 2.0

    # ---- 🔑 首次启动凭据 ----
    # 镜像无固定口令（root 锁定，面板口令仅构建期占位）。四项不写/留空 = 全随机，
    # 启动后 docker compose logs 获取：PANEL_USER 固定 baota；PANEL_PASSWORD/ROOT_PASSWORD
    # 随机 12 位、PANEL_SAFE_PATH 随机 8 位（见首启日志）。固定请改同目录 .env（写本文件=公开）。
    # ★ 仅首次启动（data/ 为空）生效，之后再改无效，改用：
    #     docker exec -it baota bt 5        改面板口令
    #     docker exec baota passwd root     改 root 口令
    environment:
      TZ: Asia/Shanghai
      # PANEL_USER: baota           # 不写/留空 → 默认 baota
      # PANEL_PASSWORD: ""          # 不写/留空 → 随机 12 位，见首次启动日志
      # PANEL_SAFE_PATH: ""         # 不写/留空 → 随机 8 位，见面板地址
      # ROOT_PASSWORD: ""           # 不写/留空 → 随机 12 位，见首次启动日志

    # ---- 💾 持久化：只挂一个 data（./data:/data）----
    #   data/www 业务与面板状态（bind，宿主可直改）｜data/.system 系统层（隐藏，overlay upper）
    #   ｜data/.baota 并发锁元数据（隐藏）。不持久化：面板代码（init.sh 用镜像绑定盖回，
    #   面板内点「更新」不生效，由守卫兜住）与 /www/wwwlogs。面板组件/插件/cron 在
    #   data/.system/www/server，重建后免重装。
    #   ★ data 必须落 ext4/btrfs/xfs（飞牛存储池即满足）；放 SMB/NFS/exFAT/NTFS 会
    #   「挂载成功但只读」、写入静默失败。完整映射见 docs/conventions.md。
    volumes:
      - ./data:/data

    # 默认 bridge 网络：单容器无需容器互访，少一层网络更干净；端口映射照常生效。
    network_mode: bridge

    ports:
      # ⚠️ 面板端口以面板设置(port.pl)为准；面板里改端口后须同步改左侧端口再重建，否则外网不通
      - "8888:8888"     # 面板
      - "888:888"       # phpMyAdmin（数据库 Web 入口，勿直曝公网）
      - "8880:80"       # 站点 HTTP（宿主机 80 被 fnOS 占用）
      - "8443:443"      # 站点 HTTPS（宿主机 443 被 fnOS 占用）
      # 以下默认关闭，按需开启；曝公网前先做好访问控制
      # - "2222:22"      # SSH（root 口令见首启日志）
      # - "3306:3306"     # MySQL（无需外连则关）
      # - "20-21:20-21"     # FTP 主动+被动
      # - "39000-40000:39000-40000"

    # 健康检查判据在镜像内 /baota/healthcheck.sh（五段）：
    #   1) /run/baota/critical 不存在（持久化失败/只读降级时 init.sh 写入，compose ps 直接可见）
    #   2) /data 与 /data/.system 磁盘水位（可用<1GB 或已用≥95% → unhealthy，满盘前预警）
    #   3) pyenv/bin/python3 → /baota/shim.sh（执行入口守卫在位）
    #   4) 面板代码版本 == 镜像版本（点过「更新」而守卫没兜住时立刻可见）
    #   5) 面板端口可访问（从 port.pl 现读，http 失败再试 https）
    # 探活命令绝不能出现面板进程名，否则被 bt 脚本 ps|grep 误判「面板已运行」而跳过启动；
    # 调整判据改脚本（可单独执行测试），compose 不动。
    healthcheck:
      test: [CMD, /baota/healthcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    # 面板日志量大，限制 Docker 侧日志体积，避免长期运行写满存储
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"