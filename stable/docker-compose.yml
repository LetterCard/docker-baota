# ==============================================================================
#  宝塔 Linux 面板 12.x —— 容器编排（已按飞牛 NAS / fnOS 适配）
#
#  【飞牛 NAS 部署步骤】
#    1. 打开「Docker」→「项目」→「新建项目」
#    2. 项目名填 baota，把本文件内容粘贴进「compose 配置」
#    3. 把下面的 image 改成自己 DockerHub 上的镜像名
#    4. 点「立即构建」，等镜像拉取完成并启动
#    5. 看日志拿首次登录信息：「容器」→ baota →「日志」
#       （或命令行 docker compose logs -f baota）
#
#    所有数据会存到本文件同级的 data 目录里。飞牛新建的项目就落在存储池上，
#    直接用默认的 ./data 即可；要放到别的盘，把它改成绝对路径（如 /vol2/baota/data）。
#
#  【为什么端口是这样映射的】
#    fnOS 自身占用：5666 / 5667（Web 管理），且「设置 → 安全性」里
#    默认开启了「重定向 80 与 443 端口」，也就是宿主机的 80、443 已被占用；
#    另外 22 通常被宿主机 sshd 占用。
#    所以这里把 80/443/22 分别挪到 8080/8443/2222，开箱即可 up 成功。
#    如果确实需要宿主机的 80/443（例如给站点签 Let's Encrypt 证书），
#    先到 fnOS「设置 → 安全性」关闭「重定向 80 与 443 端口」，
#    再把下面的映射改回 "80:80" 与 "443:443"。
#
#  【非飞牛环境】
#    普通 x86_64 Linux 服务器可直接使用本文件；
#    需要本地构建镜像时：cd stable && docker build -t baota:dev .
# ==============================================================================
name: baota

services:
  baota:
    image: bugseeker/baota:12.0.0
    container_name: baota
    hostname: baota
    restart: unless-stopped

    # 镜像同时发布了 amd64 与 arm64，Docker 会自动挑匹配的架构。
    #
    # 保留本行是给 x86 机型的一道保险（明确锁定，避免拉错）。
    # ★ ARM 机型（含 ARM 版飞牛）请把本行注释掉 ——
    #   否则会跑在 QEMU 模拟下，性能损耗明显。
    platform: linux/amd64

    # ---- 运行 systemd + overlay 持久化的必要条件 ----
    # privileged：容器内要 mount overlay、要跑 systemd、宝塔还要管服务和 iptables。
    #   等同于把宿主机内核交给容器，请只在自己信任的内网环境使用。
    # 注意这里故意不写 cgroup: host ——
    #   飞牛（Debian 12 内核）是 cgroup v2，Docker 默认给私有 cgroup 命名空间，
    #   systemd 在这种模式下工作正常且不会去动宿主机的 cgroup 树；
    #   而在老的 cgroup v1 宿主机上 Docker 又会自动退回 host 模式。
    #   保持默认，两种环境都对。
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    # /run、/run/lock 必须是 tmpfs：systemd 的运行态不能落盘，
    # 否则重建后会读到过期的 pid / socket 导致服务起不来。
    # /tmp 故意不放 tmpfs：面板上传大文件、解压备份都在 /tmp，
    # 走内存容易把 NAS 撑爆；留在容器可写层，落盘且随容器销毁。
    tmpfs:
      - /run
      - /run/lock

    # systemd 收到 SIGRTMIN+3 才会走正常关机流程（依次停掉 nginx/mysql/面板）。
    # 默认的 SIGTERM 对 PID 1 的 systemd 是「重新执行自己」，会导致直接超时被杀。
    stop_signal: SIGRTMIN+3
    stop_grace_period: 90s

    # /dev/shm 默认仅 64M，MySQL / Redis 运行时会踩坑
    shm_size: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

    # ---- 首次启动的初始凭据 ----
    #
    # 镜像里不含任何固定口令：root 是锁定状态，面板口令只是构建期的随机占位，
    # 谁都猜不到、也没意义。真正的凭据在容器首次启动时才确定。
    #
    # 下面这四项，不写、或写了留空，行为如下：
    #
    #   变量              | 不写 / 留空的效果        | 登录后在哪能看到
    #   ------------------|------------------------|--------------------------------
    #   PANEL_USER        | 固定为 baota（不会随机）  | 面板登录页用户名
    #   PANEL_PASSWORD    | 随机生成 12 位           | 首次启动日志（只打印这一次）
    #   PANEL_SAFE_PATH   | 随机生成 8 位            | 面板地址里 /login 前面那一段
    #   ROOT_PASSWORD     | 随机生成 12 位           | 首次启动日志（只打印这一次）
    #
    # 也就是说：全部保持注释 = 全随机，这是最省事也最安全的用法，
    # 启动后执行一次 docker compose logs 就能拿到，见文件开头的第 5 步。
    #
    # 想自己指定就取消注释填写。注意这个文件是要提交到 Git 的，
    # 口令写在这里等于公开；若既要固定又要保密，改用同目录的 .env 文件。
    #
    # ★ 重要：这四项只在「首次启动」生效，即 data/ 目录为空的那一次。
    #   之后再改这里不会有任何效果 —— 那时请用：
    #     改面板口令：docker exec -it baota bt 5
    #     改 root 口令：docker exec baota passwd root
    #   这是故意的：否则重启一次容器就会把你在面板里设的东西覆盖掉。
    environment:
      TZ: Asia/Shanghai
      # PANEL_USER: baota           # 不写/留空 → 默认 baota
      # PANEL_PASSWORD: ""          # 不写/留空 → 随机 12 位，见首次启动日志
      # PANEL_SAFE_PATH: ""         # 不写/留空 → 随机 8 位，见面板地址
      # ROOT_PASSWORD: ""           # 不写/留空 → 随机 12 位，见首次启动日志

    # ---- 持久化：一个 data 目录保住 8 个核心目录 ----
    # 就放在本文件旁边，可以直接用飞牛「文件管理」翻看和备份：
    #   data/www/upper    站点、数据库、备份、证书、面板本体
    #   data/etc/upper    系统与服务配置
    #   data/usr/upper    apt / 源码装的软件
    #   data/<目录>/work  overlay 工作目录，可以删，启动时自动重建
    # 备份只需要各个 upper；work 是临时的。
    #
    # 唯一要求：data 必须落在 ext4 / btrfs / xfs 上（飞牛的存储池就是，直接可用）。
    # 放到 SMB / NFS 网络共享或 exFAT / NTFS 移动盘上，overlay 会「挂载成功但只读」，
    # 之后所有写入静默失败。容器启动时会实测一次并明确告警，看到告警就立刻换位置。
    volumes:
      - ./data:/data

    # 用 Docker 自带的默认 bridge 网络，不额外创建项目专属网络：
    # 单容器部署没有容器间用名字互访的需求，少一层网络更干净。
    # 端口映射照常生效，容器会拿到 docker0 上的内网 IP。
    network_mode: bridge

    ports:
      - "8888:8888"     # 面板
      - "888:888"       # phpMyAdmin
      - "8080:80"       # 站点 HTTP（宿主机 80 被 fnOS 占用）
      - "8443:443"      # 站点 HTTPS（宿主机 443 被 fnOS 占用）
      - "2222:22"       # SSH（root 口令见首启日志，非必要建议注释掉本行）
      - "3306:3306"     # MySQL
      # FTP 主动 + 被动端口。被动端口范围大，非必要不开。
      # - "20-21:20-21"
      # - "39000-40000:39000-40000"

    # 面板端口可能被用户在面板里改掉，所以从 port.pl 现读；
    # 面板开了 HTTPS 也能探到，故 http 失败再试 https。
    # 注意：探活命令里绝不能出现面板进程名，否则会被 bt 脚本的 ps|grep 误判成
    # 「面板已在运行」而跳过启动。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          p=$$(cat /www/server/panel/data/port.pl 2>/dev/null || echo 8888);
          curl -skf -o /dev/null "http://127.0.0.1:$$p/"
          || curl -skf -o /dev/null "https://127.0.0.1:$$p/"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    # 面板日志量不小，限制 Docker 侧日志体积，避免长期运行把存储写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"